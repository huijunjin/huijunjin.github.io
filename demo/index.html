<script>
// Overview: one dataset's life (build, update, search) lived side by side by
// Milvus's HNSW and by the unified index, both actually run on the same 2-D
// points in the browser. Left pane: fixed M, a full rebuild after the update, no
// shortcuts. Right pane: DHNSW budgets, the update done in place with ROE / RDN /
// RUE, shortcuts mined from past queries. The data are two clouds, each a dense
// core in a sparse spread, with the queries coming from the gap between them.
(function () {
  'use strict';
  let T;   // the current language's copy, read on mount
  const N = 400, MV = 3, EFC = 40, K = 10, EF = 12, NTRAIN = 200, NTEST = 150, BUDGET = 8;
  const SEED = App.params.has('seed') ? App.seed : 1;
  const CY = 0.2, SY = 0.05, CORE = 0.4, SP = 0.016;   // cloud centres at CY and 1 - CY: few links cross the gap
  const num = (v, d = 0) => v.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const MINUS = '−';
  const pct = (a, b) => { const p = Math.round(100 * (b - a) / a); return (p > 0 ? '+' : p < 0 ? MINUS : '') + Math.abs(p) + ' %'; };
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  App.register('versus', {
    mount(stage) {
      T = STR.versus;
      const ui = App.layout(stage, {
        transport: true, cite: App.cite('all'),
        kicker: T.kicker, meta: T.meta, title: T.title, lead: T.lead,
        legend: [],
        body: `<ol class="steps compact" id="ov-steps">${T.steps.map(([b, m, s], i) =>
                 `<li data-seg="${i}" style="--step: var(--${['density', 'repair', 'shortcut'][i]})"><span class="n">${i + 1}</span><div><b>${b}</b><span class="mod mod-${i}">${m}</span><span>${s}</span></div></li>`).join('')}</ol>
               <p class="note-small">${T.note}</p>
               <div class="hint">${T.hint}</div>`,
        metrics: `<div class="metric"><div class="label" id="ov-a-l"></div><div class="value" id="ov-a"></div><div class="note" id="ov-a-n"></div></div>
                  <div class="metric sm"><div class="label" id="ov-b-l"></div><div class="value" id="ov-b"></div><div class="note" id="ov-b-n"></div></div>`,
      });
      const C = Draw.tokens();
      let cv = Draw.setup(ui.canvas, App.pixelZoom());
      // Two panes side by side: Milvus on the left, the unified index on the right.
      const X0 = 40, X1 = cv.w - 40, MID = cv.w / 2, TOP = 168, BOT = cv.h - 124;   // the bottom band stays free for the caption
      const PANES = [[X0, MID - 14], [MID + 14, X1]];
      const aspect = (PANES[0][1] - PANES[0][0]) / (BOT - TOP);
      const views = () => PANES.map(([a, b]) => Draw.view(cv.w, cv.h, aspect, [TOP, cv.w - b, cv.h - BOT, a]));
      let V = views();
      let player, frame = { i: 0, k: 1 };

      // ---- the data ----
      const r = HN.rng(SEED * 101 + 7);
      const cores = [0, 1].map(b => Array.from({ length: 2 }, () => [0.15 + r() * (aspect - 0.3), b ? 1 - CY : CY]));
      const data = rr => {
        const b = rr() < 0.5 ? 0 : 1, c = b ? 1 - CY : CY;
        let p;
        if (rr() < CORE) { const o = cores[b][Math.floor(rr() * 2)]; p = [o[0] + HN.gauss(rr) * 0.06, o[1] + HN.gauss(rr) * SY * 0.5]; }
        else p = [0.04 + rr() * (aspect - 0.08), c + HN.gauss(rr) * SY];
        return p[0] > 0.02 && p[0] < aspect - 0.02 && p[1] > 0.03 && p[1] < 0.97 && Math.abs(p[1] - 0.5) > 0.12 ? p : null;
      };
      const ood = rr => [0.08 + rr() * (aspect - 0.16), 0.5 + (rr() - 0.5) * 0.12];
      const all = HN.sample(r, N + N / 4, data, SP);
      const init = all.slice(0, N), fresh = all.slice(N, N + N / 5);
      const train = Array.from({ length: NTRAIN }, () => ood(r));
      const test = Array.from({ length: NTEST }, () => ood(r));

      // ---- the two lives, computed once ----
      const edges = g => g.links.reduce((a, ls, i) => a + (g.dead[i] ? 0 : ls.reduce((b, l) => b + l.length, 0)), 0);
      const Mg = new HN.HNSW({ M: MV, efConstruction: EFC, seed: SEED });
      init.forEach(p => Mg.add(p));
      const B = HN.budgets(HN.densities(init), { mVanilla: MV, efVanilla: EFC, lambda: 1, paperDirection: true });
      const Ug = new HN.HNSW({ M: MV, efConstruction: EFC, seed: SEED });
      init.forEach((p, i) => Ug.add(p, null, B.per[i]));
      const build = { kw: Mg.ndist, un: Ug.ndist, ekw: edges(Mg), eun: edges(Ug) };
      const before = Ug.clone();
      const pick = HN.rng(SEED * 31 + 5);
      const ids = HN.shuffle(pick, [...Array(N).keys()].filter(i => i !== Ug.entry && i !== Mg.entry)).slice(0, fresh.length);
      const idset = new Set(ids), order = new Map(ids.map((id, j) => [id, j]));
      const finalPts = init.slice();
      ids.forEach((id, j) => { finalPts[id] = fresh[j]; });
      const Mr = new HN.HNSW({ M: MV, efConstruction: EFC, seed: SEED + 1 });
      finalPts.forEach(p => Mr.add(p));
      const u0 = Ug.ndist;
      ids.forEach(i => Ug.markDelete(i));
      Ug.removeObsoleteEdges(ids);
      fresh.forEach(p => Ug.replace(p));
      // Only RDN's links are highlighted: they are the ones that reconnect cut-off points.
      const repaired = Ug.repairDisconnectedNodes().filter(e => e[2] === 0);
      Ug.resolveEdgeAsymmetry();
      const update = { kw: Mr.ndist, un: Ug.ndist - u0, lost: Ug.size - Ug.ndead - Ug.reachable().reduce((a, b) => a + b, 0) };
      const Us = Ug.clone();
      const pairs = Us.mineShortcuts(train, K, EF, BUDGET);
      Us.injectShortcuts(pairs);
      const shortKey = new Set(pairs.filter(([a, b]) => Us.links[a][0].includes(b)).map(([a, b]) => a + ',' + b));

      // Search cost at a matched recall: distance computations per query to reach 95 %.
      function costAt(g, qs) {
        for (const ef of [5, 6, 8, 10, 12, 16, 20, 24, 32, 40, 48, 64, 96, 128, 192, 256]) {
          if (g.recall(qs, K, ef) >= 0.95) { const b = g.ndist; qs.forEach(qq => g.search(qq, K, ef)); return Math.round((g.ndist - b) / qs.length); }
        }
        return null;
      }
      const search = { kw: costAt(Mr, test), un: costAt(Us, test) };
      const walkOf = (g, qq) => {
        const res = g.search(qq, K, EF, { trace: true }), truth = g.bruteForce(qq, K);
        const first = new Map();
        res.trace.evaluated.forEach((e, i) => { if (!first.has(e.id)) first.set(e.id, i); });
        return { g, ids: res.ids, truth, events: res.trace.evaluated, path: res.trace.path,
                 reveal: res.trace.path.map(id => (id === g.entry ? -1 : first.get(id))), found: res.ids.filter(id => truth.includes(id)).length };
      };
      // The query both panes search first: one the shortcuts help, crossing the gap on one.
      let q = test[0], walks;
      {
        let best = -Infinity;
        for (const tq of test) {
          const a = walkOf(Mr, tq), b = walkOf(Us, tq);
          const cross = b.path.some((v, i) => i > 0 && isShort(b.path[i - 1], v) && (Us.pts[b.path[i - 1]][1] < 0.5) !== (Us.pts[v][1] < 0.5));
          const score = (cross ? 100 : 0) + (b.found - a.found) * 10 - b.events.length / 100;
          if (score > best) { best = score; q = tq; }
        }
      }
      const searchBoth = () => { walks = { kw: walkOf(Mr, q), un: walkOf(Us, q) }; };
      searchBoth();

      // ---- drawing ----
      // Layer-0 links, each with the later endpoint's id (the build order).
      const layer0 = g => {
        const out = [];
        g.links.forEach((ls, u) => {
          if (g.dead[u]) return;
          for (const v of ls[0]) if (!g.dead[v] && (u < v || !g.links[v][0].includes(u))) out.push([u, v, Math.max(u, v)]);
        });
        return out.sort((a, b) => a[2] - b[2]);
      };
      const E = { Mg: layer0(Mg), Ug: layer0(before), Mr: layer0(Mr), Ua: layer0(Ug), Us: layer0(Us).filter(([a, b]) => !isShort(a, b)) };
      function segs(Vp, pts, list, color, width, alpha = 1) {
        if (!list.length || alpha <= 0) return;
        const { ctx } = cv;
        ctx.save();
        ctx.strokeStyle = Draw.alpha(color, alpha); ctx.lineWidth = width;
        ctx.beginPath();
        for (const [a, b] of list) { ctx.moveTo(Vp.x(pts[a]), Vp.y(pts[a])); ctx.lineTo(Vp.x(pts[b]), Vp.y(pts[b])); }
        ctx.stroke();
        ctx.restore();
      }
      function header(p, name, sub, line, line2) {
        const x = PANES[p][0], { ctx } = cv;
        Draw.text(ctx, name, x, 84, { size: 17, color: C.ink, halo: false });
        Draw.text(ctx, sub, x, 106, { size: 13, color: C['ink-3'], weight: 400, halo: false });
        if (line) Draw.text(ctx, line, x, 132, { size: 14, color: C.ink, halo: false });
        if (line2) Draw.text(ctx, line2, x, 154, { size: 13, color: C['ink-2'], weight: 400, halo: false });
      }
      function meter(p, value, max, k, color) {
        const { ctx } = cv, [a, b] = PANES[p], y = 148;
        ctx.fillStyle = C.line; ctx.fillRect(a, y, b - a, 4);
        ctx.fillStyle = color; ctx.fillRect(a, y, (b - a) * Math.min(1, value / max) * k, 4);
      }
      const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
      const blend = (a, b, t) => { const A = rgb(a), B2 = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B2[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
      // A unified point's colour and size from its own M, as in the density scene.
      const shade = i => blend(C.surface, C.density, 0.35 + 0.65 * (B.per[i].M - B.mStart) / Math.max(1, B.mEnd - B.mStart));
      const radius = i => 1.6 + 0.45 * B.per[i].M;
      // A build in progress: points appear as they are inserted, the newest links in the build colour.
      function building(Vp, g, list, k, dot) {
        const upto = k >= 1 ? N : k * N, newest = k < 1 ? 30 : 0;
        segs(Vp, g.pts, list.filter(e => e[2] < upto - newest), C.ink, 1, 0.14);
        segs(Vp, g.pts, list.filter(e => e[2] >= upto - newest && e[2] < upto), C.density, 1.4, 0.85);
        for (let j = 0; j < N && j < upto; j++) Draw.dot(cv.ctx, Vp, g.pts[j], dot(j));
      }
      function walk(Vp, W, k, shortcutsOn) {
        const { ctx } = cv, g = W.g, p = Math.round(k * W.events.length);
        segs(Vp, g.pts, W.events.slice(0, p).map(e => [e.from, e.id]), C.query, 1, 0.2);
        const path = W.path.filter((id, j) => W.reveal[j] < p);
        Draw.walk(ctx, Vp, path.map(id => g.pts[id]), { nodes: false, width: 2.25 });
        if (shortcutsOn) for (let i = 1; i < path.length; i++) {
          if (isShort(path[i - 1], path[i])) Draw.walk(ctx, Vp, [g.pts[path[i - 1]], g.pts[path[i]]], { color: C.shortcut, width: 3, nodes: false });
        }
        for (const id of path) Draw.dot(ctx, Vp, g.pts[id], { r: 3.4, fill: C.query, ring: 1.5 });
        if (p >= W.events.length) for (const id of W.truth) {
          if (W.ids.includes(id)) Draw.ring(ctx, Vp, g.pts[id], { r: 7 });
          else Draw.ring(ctx, Vp, g.pts[id], { r: 7, color: C.broken, width: 1.75, dash: [3, 3] });
        }
        Draw.query(ctx, Vp, q, { r: 5.5 });
      }

      // The update: the replaced points first turn red on both sides; then Milvus
      // drops the graph and builds it again, while the unified index moves the new
      // points into the freed slots one after another and repairs the links.
      const RED = 0.22, GO = 0.3;
      const stageK = k => Math.max(0, (k - RED - 0.03) / (1 - RED - 0.03));
      const moved = (i, k2) => Math.max(0, Math.min(1, (k2 - order.get(i) / Math.max(1, ids.length - 1) * (1 - GO)) / GO));
      function updating(k) {
        const { ctx } = cv, redK = Math.min(1, k / RED), k2 = stageK(k);
        // Milvus: the old graph fades out, the whole graph is built again (rebuilt points in blue).
        const old = 1 - Math.min(1, k2 / 0.2);
        segs(V[0], Mg.pts, E.Mg, C.ink, 1, 0.14 * old);
        const upto = k2 >= 1 ? N : Math.max(0, (k2 - 0.15) / 0.85) * N;
        segs(V[0], Mr.pts, E.Mr.filter(e => e[2] < upto), C.ink, 1, 0.14);
        for (let j = 0; j < N; j++) {
          if (j < upto) Draw.dot(ctx, V[0], finalPts[j], { r: 2.4, fill: C.query });
          else if (old > 0) Draw.dot(ctx, V[0], init[j], { r: idset.has(j) ? 3 : 2.4, fill: blend(C.surface, idset.has(j) ? blend(C.point, C.broken, redK) : C.point, Math.max(0.25, old)) });
        }
        // Unified: the graph stays; each replaced point moves to its new place, its links follow, RDN's links appear.
        const pos = before.pts.map((p, j) => {
          if (!idset.has(j)) return p;
          const t = ease(moved(j, k2));
          return [p[0] + (Ug.pts[j][0] - p[0]) * t, p[1] + (Ug.pts[j][1] - p[1]) * t];
        });
        const touches = e => idset.has(e[0]) || idset.has(e[1]);
        const w = e => Math.min(idset.has(e[0]) ? moved(e[0], k2) : 1, idset.has(e[1]) ? moved(e[1], k2) : 1);
        segs(V[1], pos, E.Ug.filter(e => !touches(e)), C.ink, 1, 0.14);
        segs(V[1], init, E.Ug.filter(touches), C.broken, 1, 0.5 * redK * (1 - Math.min(1, k2 / 0.15)));
        for (const e of E.Ua) if (touches(e) && w(e) > 0) segs(V[1], pos, [e], C.ink, 1, 0.14 * w(e));
        segs(V[1], pos, repaired.map(([u, v]) => [u, v]), C.repair, 1.75, Math.max(0, (k2 - 0.85) / 0.15));
        for (let j = 0; j < N; j++) {
          if (!idset.has(j)) { Draw.dot(ctx, V[1], pos[j], { r: 2.4, fill: C.point }); continue; }
          const t = moved(j, k2);
          Draw.dot(ctx, V[1], pos[j], { r: 3, fill: t > 0 ? blend(C.broken, C.query, Math.min(1, t / 0.3)) : blend(C.point, C.broken, redK), ring: t > 0 ? 1.2 : 0 });
        }
      }

      function render(i, k) {
        frame = { i, k };
        const { ctx } = cv;
        ctx.clearRect(0, 0, cv.w, cv.h);
        ctx.fillStyle = C.line; ctx.fillRect(MID, 70, 1, BOT - 70);
        if (i === 0) {
          header(0, T.kw, T.kwSub, `${T.build.edges(num(Math.round(build.ekw * k)))} · ${T.build.avg(num(build.ekw / N, 1))}`, T.build.allM(MV));
          header(1, T.un, T.unSub, `${T.build.edges(num(Math.round(build.eun * k)))} · ${T.build.avg(num(build.eun / N, 1))}`, T.build.range(B.mStart, B.mEnd));
          building(V[0], Mg, E.Mg, k, () => ({ r: 2.4, fill: C.point }));
          building(V[1], before, E.Ug, k, j => ({ r: radius(j), fill: shade(j) }));
          App.caption(ui.subtitle, k < 1 ? T.sub.building : T.sub.built(pct(build.ekw, build.eun)));
        } else if (i === 1) {
          const k2 = stageK(k);
          header(0, T.kw, T.update.kw, T.update.cost(num(Math.round(update.kw * k2))));
          header(1, T.un, T.update.un, T.update.cost(num(Math.round(update.un * k2))));
          meter(0, update.kw, update.kw, k2, C.base);
          meter(1, update.un, update.kw, k2, C.repair);
          updating(k);
          App.caption(ui.subtitle, k < RED ? T.sub.marked(ids.length) : k < 1 ? T.sub.updating : T.sub.updated(pct(update.kw, update.un)));
        } else {
          const done = k >= 1;
          header(0, T.kw, T.kwSub, search.kw ? T.search.cost(num(search.kw)) : '', done ? T.search.found(walks.kw.found, K) : '');
          header(1, T.un, T.unSub, search.un ? T.search.cost(num(search.un)) : '', done ? T.search.found(walks.un.found, K) : '');
          segs(V[0], Mr.pts, E.Mr, C.ink, 1, 0.14);
          segs(V[1], Us.pts, E.Us, C.ink, 1, 0.14);
          segs(V[1], Us.pts, shortcuts, C.shortcut, 1.25, 0.55);
          for (const p of Mr.pts) Draw.dot(ctx, V[0], p, { r: 2.1, fill: C.point });
          for (const p of Us.pts) Draw.dot(ctx, V[1], p, { r: 2.1, fill: C.point });
          walk(V[0], walks.kw, k, false);
          walk(V[1], walks.un, k, true);
          App.caption(ui.subtitle, done ? T.sub.searched(walks.kw.found, walks.un.found, K) : T.sub.searching);
        }
        metrics(i);
      }

      // Panel numbers: the 2-D comparison of the current step.
      function metrics(i) {
        const set = (id, v) => { ui.q(id).innerHTML = v; };
        const H = T.hero[i];
        const vals = [[build.ekw, build.eun, build.ekw / N, build.eun / N], [update.kw, update.un, null, update.lost], [search.kw, search.un, walks.kw.found, walks.un.found]][i];
        set('#ov-a-l', `${H[0]} <span class="tiny">${STR.principle}</span>`);
        set('#ov-a', vals[0] && vals[1] ? pct(vals[0], vals[1]) : '–');
        set('#ov-a-n', T.pair(num(vals[0] || 0), num(vals[1] || 0)));
        set('#ov-b-l', H[1]);
        if (i === 0) { set('#ov-b', num(vals[3], 1)); set('#ov-b-n', T.pair(num(vals[2], 1), num(vals[3], 1))); }
        else if (i === 1) { set('#ov-b', `${vals[3]}<small>${STR.unit.count}</small>`); set('#ov-b-n', ''); }
        else { set('#ov-b', `${vals[3]}<small>/ ${K}</small>`); set('#ov-b-n', T.pair(`${vals[2]}/${K}`, `${vals[3]}/${K}`)); }
      }

      const syncTransport = App.bindTransport(ui.transport, () => player);
      function onChange(st) {
        syncTransport(st);
        const L = T.legend;
        App.setLegend(ui, [
          [['k-point', L.milvus], ['k-dense', L.dense], ['k-sparse', L.sparse], ['k-link', L.link]],
          [['k-del', L.deleted], ['k-new', L.moved], ['k-repair', L.rdn]],
          [['k-walk', L.walk], ['k-short', L.short], ['k-found', L.found], ['k-missed', L.missed]],
        ][st.i]);
        ui.q('#ov-steps').querySelectorAll('li').forEach((li, j) => {
          const done = j < st.i || (j === st.i && st.k >= 1 && !st.playing && j === 2);
          li.classList.toggle('active', j === st.i && !done);
          li.classList.toggle('done', done);
          li.querySelector('.n').textContent = done ? '✓' : j + 1;
        });
      }
      const segments = () => [{ dur: 7000 }, { dur: 8000 }, { dur: Math.max(4800, walks.un.events.length * 170) }];
      player = App.player({ segments: segments(), render, onChange, hold: 4500 });
      if (App.step != null) player.show(Math.min(2, App.step), App.params.has('k') ? +App.params.get('k') : 1); else player.playAll();
      ui.q('#ov-steps').addEventListener('click', e => { const li = e.target.closest('li[data-seg]'); if (li) player.goto(+li.dataset.seg); });

      // ---- interaction: a query placed on either pane is searched on both ----
      let drag = false;
      const moveTo = ev => {
        const [x, y] = Draw.pointer(ui.canvas, ev);
        const d = V[x < MID ? 0 : 1].inv(x, y);
        q = [Math.max(0, Math.min(aspect, d[0])), Math.max(0, Math.min(1, d[1]))];
        searchBoth();
        player.setSegments(segments());
        player.show(2, 1);
      };
      ui.canvas.style.cursor = 'crosshair';
      ui.canvas.addEventListener('pointerdown', ev => { drag = true; ui.canvas.setPointerCapture(ev.pointerId); moveTo(ev); });
      ui.canvas.addEventListener('pointermove', ev => { if (drag) moveTo(ev); });
      const release = () => { if (!drag) return; drag = false; player.goto(2); };
      ui.canvas.addEventListener('pointerup', release);
      ui.canvas.addEventListener('pointercancel', release);

      return {
        resize() { cv = Draw.setup(ui.canvas, App.pixelZoom()); V = views(); render(frame.i, frame.k); },
        unmount() { player.stop(); },
      };
    },
  });
})();
</script>
<script>
// Measured results. Every number here comes from data/results.json (loaded as
// window.RESULTS via data/results.js) and each view prints that block's source.
// Charts pair the baseline grey with one research colour.
(function () {
  'use strict';
  let T;   // the current language's copy, read on mount
  const MINUS = '−';
  const num = (v, d = 0) => v.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const signed = v => (v > 0 ? '+' : v < 0 ? MINUS : '') + num(Math.abs(v), Number.isInteger(v) ? 0 : 1) + ' %';
  const range = (vs, f) => {
    const lo = Math.min(...vs), hi = Math.max(...vs);
    return lo === hi ? f(lo) : `${f(lo)} ~ ${f(hi)}`;
  };

  App.register('perf', {
    mount(stage) {
      T = STR.perf;
      const R = window.RESULTS, KH = R.knowhere, UR = KH.update_repair;
      // The dataset list and lookups are shared with the head-to-head scene (src/measured.js).
      const { list: ALL, extra: EXTRA, pick, urPick, KX } = Measured;
      // Full provenance lives in results.json; the page shows a short, public-safe line.
      const label = d => d;
      const ui = App.layout(stage, {
        chart: true, badge: STR.measured, cite: App.cite('all'),
        kicker: T.kicker, meta: T.meta, title: T.title, lead: T.lead,
        body: `<ol class="views" id="pf-views">${T.views.map(([b, s], i) =>
                 `<li><button data-view="${i}"><span class="n">${i + 1}</span><span><b>${b}</b><small>${s}</small></span></button></li>`).join('')}</ol>`,
        metrics: `<div class="metric" style="grid-column: 1 / -1"><div class="label" id="pf-hero-label"></div><div class="value hero-sm" id="pf-hero"></div><div class="note" id="pf-hero-note"></div></div>`,
      });
      const C = Draw.tokens();
      const host = ui.chart;
      const state = { view: +(App.params.get('view') || 0), tech: 'qs', rpMetric: 'unr', pipeMetric: 'qps', };
      // Each technique on its own paper's metric: shortcuts QPS, density-adaptive build time.
      const METRIC = { qs: 'qps', dab: 'build', both: 'qps' };
      const techColor = { qs: C.shortcut, dab: C.density, both: C.query };

      // Each view returns the chart spec plus its headline number.
      const views = [
        // At a glance: one headline per study, each on its own paper's metric, over the datasets shown.
        () => {
          const L = ALL, MINUS2 = MINUS;
          const both = L.map(d => pick('both_vs_knowhere', 'qps_at_recall99_pct', d));
          const dab = L.map(d => pick('density_adaptive_build_vs_knowhere', 'build_pct', d));
          const lost = L.map(d => [d, urPick('unreachable_nodes', 'update_only', d), urPick('unreachable_nodes', 'update_repair', d)]);
          const worst = lost.reduce((a, b) => (b[1] > a[1] ? b : a));
          const keep = L.map(d => Math.round(100 * urPick('upkeep_s', 'update_repair', d) / urPick('upkeep_s', 'rebuild', d)));
          const sp = R.chapter6_pipeline.churn_100_104.speedup;
          const x = v => num(1 + v / 100, 1), S = T.sum.tiles;
          const values = [
            [S[0][2](x(Math.max(...both))), S[0][3](x(Math.min(...both)), x(Math.max(...both)))],
            [S[1][2](`${MINUS2}${num(Math.abs(Math.max(...dab)), 0)} ~ ${MINUS2}${num(Math.abs(Math.min(...dab)), 0)} %`), S[1][3]()],
            [S[2][2](`${num(worst[1])} → ${num(worst[2])}`), S[2][3](worst[0])],
            [S[3][2](`${Math.min(...keep)} ~ ${Math.max(...keep)} %`), S[3][3]()],
            [S[4][2](`${num(Math.min(...sp), 2)} ~ ${num(Math.max(...sp), 2)}`), S[4][3]()],
          ];
          return {
            kind: 'tiles', title: T.sum.title, sub: T.sum.sub, ctrls: [], series: [],
            tiles: S.map((t, i) => ({ color: t[0], label: t[1], value: values[i][0], note: values[i][1] })),
            better: 'up', hero: { label: T.sum.hero, value: values[0][0], note: '' }, source: T.src.sum,
          };
        },
        () => {
          const key = { qs: 'query_shortcuts_vs_knowhere', dab: 'density_adaptive_build_vs_knowhere', both: 'both_vs_knowhere' }[state.tech];
          const metric = METRIC[state.tech];
          const field = metric === 'qps' ? 'qps_at_recall99_pct' : 'build_pct';
          const tName = T.kh.tech.find(t => t[0] === state.tech)[1], mName = T.kh.metric.find(m => m[0] === metric)[1];
          const present = ALL.map(d => pick(key, field, d)).filter(v => v != null);
          return {
            title: T.kh.title, sub: T.kh.sub(tName, mName),
            ctrls: [['tech', T.kh.tech, state.tech]],
            series: [{ name: tName, color: techColor[state.tech] }],
            rows: ALL.map(d => ({ label: label(d), values: [pick(key, field, d)] })),
            fmt: signed, better: metric === 'qps' ? 'up' : 'down',
            hero: { label: T.kh.heroLabel(tName, mName), value: range(present, signed), note: '' },
            source: T.src.kh,
          };
        },
        () => {
          const m = state.rpMetric, S = T.rp.series;
          const spec = { unr: ['unreachable_nodes', 'update_only', 'update_repair', S.only, v => num(v) + STR.unit.count, 'down'],
                         upkeep: ['upkeep_s', 'rebuild', 'update_repair', S.rebuild, v => num(v, 1) + STR.unit.sec, 'down'],
                         recall: ['recall10_at_ef128_pct', 'update_only', 'update_repair', S.only, v => num(v, 1) + ' %', 'up'] }[m];
          const [field, a, b, aName, fmt, better] = spec;
          const A = Object.fromEntries(ALL.map(d => [d, urPick(field, a, d)])), B = Object.fromEntries(ALL.map(d => [d, urPick(field, b, d)]));
          const done = ALL;
          let hero;
          if (m === 'unr') hero = { label: T.rp.heroUnr, value: `${range(done.map(d => A[d]), num)} → ${range(done.map(d => B[d]), num)}`, note: `${S.only} → ${S.repair}` };
          else if (m === 'upkeep') hero = { label: T.rp.heroUpkeep, value: range(done.map(d => Math.round(100 * B[d] / A[d])), v => v + ' %'), note: `${S.repair} ÷ ${S.rebuild}` };
          else hero = { label: T.rp.heroRecall, value: range(done.map(d => +(B[d] - A[d]).toFixed(1)), v => (v >= 0 ? '+' : MINUS) + num(Math.abs(v), 1) + ' %p'), note: `${S.repair} − ${S.only}` };
          return {
            title: T.rp.title, sub: T.rp.sub(T.rp.metric.find(x => x[0] === m)[1]),
            ctrls: [['rpMetric', T.rp.metric, m]],
            series: [{ name: aName, color: C.base }, { name: S.repair, color: C.repair }],
            rows: ALL.map(d => ({ label: label(d), values: [A[d], B[d]] })),
            fmt, better, hero, source: T.src.rp,
          };
        },
        // The full cycle with every technique on, against vanilla HNSW (Chapter 6's pipeline).
        () => {
          const F = R.full_cycle_curve, six = R.chapter6_pipeline.six_arms_churn100;
          const a = six.vanilla.qps_at_recall90, b = six.full.qps_at_recall90;
          return {
            kind: 'curve', title: T.cv.title, sub: T.cv.sub(), ctrls: [],
            series: [{ name: T.cv.series[0], color: C.base }, { name: T.cv.series[1], color: C.query }],
            curve: { kw: F.curve.vanilla, unified: F.curve.unified }, guide: 90, match: [a, b], better: 'curve',
            hero: { label: T.cv.hero, value: T.cv.times(num(b / a, 1)), note: T.cv.best(num(six.vanilla.best_recall_pct, 1), num(six.full.best_recall_pct, 1)) },
            source: T.src.cv,
          };
        },
      ];

      function bars(spec) {
        const vals = spec.rows.flatMap(r => r.values).filter(v => v != null);
        let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
        const span = hi - lo || 1;
        if (lo < 0) lo -= span * 0.16;
        hi += span * 0.16;
        const pos = v => ((v - lo) / (hi - lo)) * 100, z = pos(0);
        const dense = spec.rows.length * spec.series.length > 12;
        return `<div class="bars2${dense ? ' dense' : ''}">${spec.rows.map(r => `
          <div class="b-lab">${r.label}</div>
          <div class="b-group">${r.values.map((v, i) => {
            if (v == null) return `<div class="b-track"><i class="b-axis" style="left:${z}%"></i><span class="b-na" style="left:calc(${z}% + 10px)">${T.na}</span></div>`;
            const neg = v < 0, x = pos(v);
            const tip = `${r.label.replace(/<[^>]+>.*$/, '')} · ${spec.series[i].name}: ${spec.fmt(v)}`;
            return `<div class="b-track"><i class="b-axis" style="left:${z}%"></i>
              <div class="b-bar pre${neg ? ' neg' : ''}" data-tip="${tip}" style="left:${neg ? x : z}%;width:${Math.abs(x - z)}%;background:${spec.series[i].color}"></div>
              <span class="b-val" style="${neg ? `right:${100 - x}%;padding-right:8px` : `left:${x}%;padding-left:8px`}">${spec.fmt(v)}</span></div>`;
          }).join('')}</div>`).join('')}</div>`;
      }

      // Recall-QPS curves as SVG: log QPS axis, both ef sweeps, the recall-99 % guide.
      function curve(spec) {
        const W = 940, Hh = 520, L = 78, Rr = W - 20, Tp = 16, B = Hh - 52;
        const all = spec.curve.kw.concat(spec.curve.unified);
        const G = spec.guide, lowest = G - 25;
        const xmin = Math.max(lowest, Math.floor(Math.min(...all.map(p => p[1]).filter(r => r >= lowest), G) / 5) * 5);
        const pts = c => c.filter(p => p[1] >= xmin);
        const qs = all.filter(p => p[1] >= xmin).map(p => p[2]);
        const y0 = Math.pow(10, Math.floor(Math.log10(Math.min(...qs)))), y1 = Math.pow(10, Math.ceil(Math.log10(Math.max(...qs))));
        const X = r => L + (r - xmin) / (100 - xmin) * (Rr - L);
        const Y = q => B - (Math.log10(q) - Math.log10(y0)) / (Math.log10(y1) - Math.log10(y0)) * (B - Tp);
        const kfmt = q => (q >= 1000 ? num(q / 1000) + 'K' : num(q));
        let g = '';
        for (let r = xmin; r <= 100; r += xmin >= 90 ? 2 : 5) {   // ticks every 2 or 5 points of recall
          g += `<line x1="${X(r)}" y1="${Tp}" x2="${X(r)}" y2="${B}" class="cv-grid"/><text x="${X(r)}" y="${B + 22}" class="cv-tick" text-anchor="middle">${r}</text>`;
        }
        for (let q = y0; q <= y1 + 1; q *= 10) {
          g += `<line x1="${L}" y1="${Y(q)}" x2="${Rr}" y2="${Y(q)}" class="cv-grid"/><text x="${L - 10}" y="${Y(q) + 4}" class="cv-tick" text-anchor="end">${kfmt(q)}</text>`;
        }
        g += `<line x1="${L}" y1="${B}" x2="${Rr}" y2="${B}" class="cv-axis"/><line x1="${L}" y1="${Tp}" x2="${L}" y2="${B}" class="cv-axis"/>`;
        g += `<text x="${(L + Rr) / 2}" y="${Hh - 6}" class="cv-label" text-anchor="middle">${T.cv.axisX}</text>`;
        g += `<text transform="translate(16 ${(Tp + B) / 2}) rotate(-90)" class="cv-label" text-anchor="middle">${T.cv.axisY}</text>`;
        g += `<line x1="${X(G)}" y1="${Tp}" x2="${X(G)}" y2="${B}" class="cv-guide"/><text x="${X(G) - 6}" y="${Tp + 14}" class="cv-tick" text-anchor="end">Recall ${G} %</text>`;
        spec.series.forEach((s, i) => {
          const c = pts(i ? spec.curve.unified : spec.curve.kw);
          g += `<path d="${c.map((p, j) => `${j ? 'L' : 'M'}${X(p[1]).toFixed(1)} ${Y(p[2]).toFixed(1)}`).join(' ')}" pathLength="1" class="cv-line pre" style="stroke:${s.color}"/>`;
          for (const p of c) {
            g += `<circle cx="${X(p[1])}" cy="${Y(p[2])}" r="5" class="cv-dot" style="fill:${s.color}" data-tip="${s.name} · ef ${num(p[0])} · Recall ${num(p[1], 2)} % · ${num(p[2])} QPS"/>`;
          }
        });
        const m = spec.match;
        if (m) {
          g += `<circle cx="${X(G)}" cy="${Y(m[0])}" r="9" class="cv-hit" style="stroke:${spec.series[0].color}"/><circle cx="${X(G)}" cy="${Y(m[1])}" r="9" class="cv-hit" style="stroke:${spec.series[1].color}"/>`;
          g += `<text x="${X(G) + 14}" y="${(Y(m[0]) + Y(m[1])) / 2 + 6}" class="cv-times">${T.cv.times(num(m[1] / m[0], 1))}</text>`;
        }
        return `<svg class="cv" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${spec.title}">${g}</svg>`;
      }

      function tiles(spec) {
        return `<div class="sum-tiles">${spec.tiles.map(t => `<div class="sum-tile" style="--c: var(--${t.color})">
          <div class="sum-label">${t.label}</div><div class="sum-value">${t.value}</div><div class="sum-note">${t.note}</div></div>`).join('')}</div>`;
      }

      function render() {
        const spec = views[state.view]();
        host.innerHTML = `
          <div class="chart-head">
            <div><h3>${spec.title}</h3><div class="sub">${spec.sub}</div></div>
            <div class="ctrls">${spec.ctrls.map(([key, opts, cur]) =>
              `<div class="seg" data-key="${key}">${opts.map(([v, label]) => `<button data-v="${v}" aria-pressed="${v === cur}">${label}</button>`).join('')}</div>`).join('')}</div>
          </div>
          ${spec.series.length > 1 ? `<div class="chart-legend">${spec.series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : ''}
          <div class="chart-body">${spec.kind === 'curve' ? curve(spec) : spec.kind === 'tiles' ? tiles(spec) : bars(spec)}</div>
          <div class="chart-foot"><b>${T.better[spec.better]}</b><span>${T.source}: ${spec.source}</span></div>
          <div class="chart-tip" hidden></div>`;
        const grow = () => host.querySelectorAll('.b-bar.pre, .cv-line.pre').forEach(b => b.classList.remove('pre'));
        if (App.still) grow(); else requestAnimationFrame(() => requestAnimationFrame(grow));
        ui.q('#pf-hero-label').textContent = spec.hero.label;
        const hero = ui.q('#pf-hero');
        hero.textContent = spec.hero.value;
        hero.style.fontSize = spec.hero.value.length > 14 ? '34px' : '';
        ui.q('#pf-hero-note').textContent = spec.hero.note;
        ui.q('#pf-views').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.view === state.view)));
      }

      ui.q('#pf-views').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (b) { state.view = +b.dataset.view; render(); }
      });
      host.addEventListener('click', e => {
        const b = e.target.closest('.seg button');
        if (!b) return;
        state[b.closest('.seg').dataset.key] = b.dataset.v;
        render();
      });
      host.addEventListener('pointermove', e => {
        const tip = host.querySelector('.chart-tip');
        const bar = e.target.closest('[data-tip]');
        if (!bar) { tip.hidden = true; return; }
        const r = host.getBoundingClientRect(), k = host.clientWidth / r.width;
        tip.textContent = bar.dataset.tip;
        tip.style.left = (e.clientX - r.left) * k + 'px';
        tip.style.top = (e.clientY - r.top) * k + 'px';
        tip.hidden = false;
      });
      host.addEventListener('pointerleave', () => { host.querySelector('.chart-tip').hidden = true; });
      render();
      return {};
    },
  });
})();
</script>
</body>
</html>
