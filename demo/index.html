          Draw.text(ctx, T.query, Mq.x(q), Mq.y(q) + 24, { align: 'center', size: 14, color: C.query });
          qScreen = [Mq.x(q), Mq.y(q)];
        }

        const n = new Set(seen.flatMap(s => [...s])).size;
        ui.q('#intro-n').innerHTML = i ? n + `<small>/ ${g.size}</small>` : '–';
        const kEl = ui.q('#intro-k'), done = i === 3 || (i === 2 && k >= 1);
        if (done) App.count(kEl, matches, { unit: `<small>/ ${K}</small>` });
        else { kEl.innerHTML = '–'; delete kEl.dataset.v; }
        App.caption(ui.subtitle, i === 0 ? T.subBuild(c) : i === 1 ? T.subUpper : i === 2 ? (k >= 1 ? T.subDone(n, g.size) : T.subBottom) : T.subFlat);
      }

      // ---- panel ----
      const Lg = T.legend;
      const LEGEND = [
        [['k-point', Lg.point], ['k-upper', Lg.upper], ['k-stack', Lg.stack]],
        [['k-point', Lg.point], ['k-upper', Lg.upper], ['k-walk-amber', Lg.jump], ['k-stack', Lg.stack]],
        [['k-point', Lg.point], ['k-seen', Lg.seen], ['k-walk', Lg.walk], ['k-found', Lg.found]],
        [['k-point', Lg.point], ['k-upper', Lg.upper], ['k-walk-amber', Lg.jump], ['k-walk', Lg.walk], ['k-found', Lg.found]],
      ];
      let player;
      const syncTransport = App.bindTransport(ui.transport, () => player);
      function onChange(st) {
        syncTransport(st);
        App.setLegend(ui, LEGEND[st.i]);
        ui.q('#intro-steps').querySelectorAll('li').forEach((li, j) => {
          const done = j < st.i || (j === st.i && st.k >= 1 && !st.playing && j === 3);
          li.classList.toggle('active', j === st.i && !done);
          li.classList.toggle('done', done);
          li.querySelector('.n').textContent = done ? '✓' : j + 1;
        });
      }

      // Start inside the map, as far from the entry as possible, so the first
      // search shows a real journey.
      if (App.params.has('qx')) q = [+App.params.get('qx'), +App.params.get('qy')];
      else {
        const e = g.pts[g.entry];
        let best = -1;
        for (let x = 0.22; x <= aspect - 0.22; x += 0.04)
          for (let y = 0.22; y <= 0.78; y += 0.04) {
            const d = HN.dist(e, [x, y]);
            if (d > best) { best = d; q = [x, y]; }
          }
      }
      compute();
      player = App.player({ segments: segments(), render, onChange, hold: 3500 });
      if (App.step != null) player.show(Math.min(3, App.step), App.params.has('k') ? +App.params.get('k') : 1);
      else player.playAll();

      // ---- interaction ----
      // The pointer lands on the plane under it (or the flat view once folded).
      function toDomain(x, y) {
        if (frame.i === 3 && ease(frame.k) > 0.5) return V.inv(x, y);
        let l = 0, bd = Infinity;
        for (let j = 0; j <= top; j++) { const d = Math.abs(y - (G.y0(j) + G.ph / 2)); if (d < bd) { bd = d; l = j; } }
        const v = (y - G.y0(l)) / G.ph;
        return [((x - G.left - (1 - v) * G.sh) / G.pw) * aspect, v];
      }
      let drag = false;
      const moveTo = ev => {
        const [x, y] = Draw.pointer(ui.canvas, ev), d = toDomain(x, y);
        q = [Math.max(0, Math.min(aspect, d[0])), Math.max(0, Math.min(1, d[1]))];
        compute();
        player.setSegments(segments());
        player.show(frame.i === 3 ? 3 : 2, 1);
      };
      const near = ev => {
        const [x, y] = Draw.pointer(ui.canvas, ev);
        return Math.hypot(x - qScreen[0], y - qScreen[1]) < 22;
      };
      ui.canvas.addEventListener('pointerdown', ev => { drag = true; ui.canvas.setPointerCapture(ev.pointerId); ui.canvas.style.cursor = 'grabbing'; moveTo(ev); });
      ui.canvas.addEventListener('pointermove', ev => {
        if (drag) moveTo(ev);
        else ui.canvas.style.cursor = near(ev) ? 'grab' : 'crosshair';
      });
      const release = () => { if (!drag) return; drag = false; ui.canvas.style.cursor = 'grab'; player.playFrom(1); };
      ui.canvas.addEventListener('pointerup', release);
      ui.canvas.addEventListener('pointercancel', release);
      ui.q('#intro-steps').addEventListener('click', ev => {
        const li = ev.target.closest('li[data-seg]');
        if (li) player.goto(+li.dataset.seg);
      });

      return {
        resize() { cv = Draw.setup(ui.canvas, App.pixelZoom()); V = Draw.view(cv.w, cv.h, aspect, PAD); geometry(); render(frame.i, frame.k); },
        unmount() { player.stop(); },
      };
    },
  });
})();
</script>
<script>
// Density-Adaptive Build (DHNSW, Chapter 3). Each point's density is its mean
// distance to its 16 nearest neighbours; the spread of those densities opens an
// M range around the vanilla M, denser points get the larger M and ef (the
// paper's direction), and the layer-0 cap is the constant 2*m_start
// (unified/density.py, addPoint's M_node / ef_node / M0_node). The scene builds the same points twice, with a
// fixed M and with these budgets, and plays the adaptive build in three steps.
(function () {
  'use strict';
  let T;   // the current language's copy, read on mount
  const N = 550, MV = 6, EFV = 40, NQ = 200, K = 10;
  const PAD = [76, 44, 124, 44];   // the bottom band stays free for the caption
  const STEPS = { fixed: [2], dhnsw: [0, 1, 2] };

  App.register('density', {
    mount(stage) {
      T = STR.density;
      const ui = App.layout(stage, {
        kicker: T.kicker, meta: T.meta, title: T.title, lead: T.lead, transport: true, zoom: true, cite: App.cite('dhnsw'),
        legend: [],
        body: `<ol class="steps compact" id="dn-steps">${T.steps.map(([b, s], i) =>
                 `<li style="--step: var(--${['amber', 'density', 'density'][i]})"><span class="n">${i + 1}</span><div><b>${b}</b><span>${s}</span><em class="tagline" hidden>${T.skipped}</em></div></li>`).join('')}</ol>
               <div class="controls">
                 <div class="row"><div class="seg" id="dn-mode">${T.modes.map((m, i) =>
                   `<button data-mode="${i ? 'dhnsw' : 'fixed'}">${m}</button>`).join('')}</div>
                   <div class="mrange" id="dn-mrange" title="M"><span class="mr-track"><i class="mr-seg"></i><i class="mr-fixed"></i></span><b id="dn-range"></b></div></div>
                 <label class="field"><div class="field-head">${T.lambda} <b id="dn-lambda-v"></b></div>
                   <input type="range" id="dn-lambda" min="0.25" max="2" step="0.25" value="1"></label>
                 <p class="note-small" id="dn-lambda-help"></p>
                 <label class="field"><div class="field-head">${T.ef} <b id="dn-ef-v"></b></div>
                   <input type="range" id="dn-ef" min="10" max="40" step="5" value="10"></label>
               </div>`,
        metrics: `<div class="metric"><div class="label">${T.edges}</div><div class="value" id="dn-edges"></div><div class="note" id="dn-edges-note"></div></div>
                  <div class="metric sm"><div class="label">${T.recall}</div><div class="value" id="dn-rec"></div><div class="note" id="dn-rec-note"></div></div>`,
      });
      const C = Draw.tokens();
      let cv = Draw.setup(ui.canvas, App.pixelZoom());
      const aspect = (cv.w - PAD[1] - PAD[3]) / (cv.h - PAD[0] - PAD[2]);
      let V = Draw.view(cv.w, cv.h, aspect, PAD);

      const r = HN.rng(App.seed * 17);
      const mix = HN.mixture(r, aspect, 9, [0.04, 0.06], 0.35);
      const pts = HN.sample(r, N, mix, 0.008 * Math.sqrt(900 / N));
      const Q = Array.from({ length: NQ }, () => { let p; while (!(p = mix(r))); return p; });
      const dens = HN.densities(pts);
      const dLo = Math.min(...dens), dHi = Math.max(...dens);
      const edgeCount = g => g.links.reduce((a, ls) => a + ls.reduce((b, l) => b + l.length, 0), 0);
      const build = budgets => {
        const g = new HN.HNSW({ M: MV, efConstruction: EFV, seed: App.seed });
        pts.forEach((p, i) => g.add(p, null, budgets && budgets[i]));
        g.cost = g.ndist;
        return g;
      };
      const fixed = build(null);
      let mode = App.params.get('mode') === 'dhnsw' ? 'dhnsw' : 'fixed';   // like every scene: the feature starts off
      let lambda = 1, ef = 10, B, adaptive, frame = { i: 0, k: 1 };
      // The paper's direction: a denser point (shorter distance to its neighbours) gets the larger M and ef.
      function rebuild() { B = HN.budgets(dens, { mVanilla: MV, efVanilla: EFV, lambda, paperDirection: true }); adaptive = build(B.per); }
      const graph = () => (mode === 'fixed' ? fixed : adaptive);
      const mOf = i => (mode === 'fixed' ? MV : B.per[i].M);
      const radius = m => 1.5 + 0.32 * m;

      // Layer-0 links in the order the later endpoint was inserted, for the build step.
      function layer0(g) {
        const out = [];
        g.links.forEach((ls, u) => { for (const v of ls[0]) if (u < v || !g.links[v][0].includes(u)) out.push([u, v, Math.max(u, v)]); });
        return out.sort((a, b) => a[2] - b[2]);
      }

      // ---- drawing: paint() takes a map M (canvas or close-up), a near(p) filter and z, the mark scale ----
      const ZR = 0.06;
      const inside = (near, e) => near(pts[e[0]]) && near(pts[e[1]]);
      function paint(M, near, g, step, k, z) {
        const { ctx } = cv;
        if (step === 2) {
          // Links as they are made: the newest ones in violet, the rest grey.
          const L = layer0(g), upto = Math.round(k * N), fresh = k < 1 ? 40 : 0;
          for (const [color, width, sel] of [[Draw.alpha(C.ink, z > 1 ? 0.3 : 0.14), 1, t => t < upto - fresh], [Draw.alpha(C.density, 0.85), 1.5, t => t >= upto - fresh && t < upto]]) {
            ctx.save();
            ctx.strokeStyle = color; ctx.lineWidth = z * width;
            ctx.beginPath();
            for (const [u, v, t] of L) {
              if (!sel(t) || (!near(pts[u]) && !near(pts[v]))) continue;
              ctx.moveTo(M.x(pts[u]), M.y(pts[u])); ctx.lineTo(M.x(pts[v]), M.y(pts[v]));
            }
            ctx.stroke();
            ctx.restore();
          }
        }
        // Density as a heat map: fades in at step 1, stays faint while the points take their M.
        if (step < 2 && mode === 'dhnsw') heat(ctx, M, near, step === 0 ? k : 1 - 0.6 * k);
        for (let j = 0; j < N; j++) {
          if (!near(pts[j])) continue;
          if (step === 0) Draw.dot(ctx, M, pts[j], { r: 2.6 * z, fill: C.point });
          else if (step === 1) {
            // From a plain point to its M: colour and size grow together.
            const m = mOf(j);
            Draw.dot(ctx, M, pts[j], { r: (2.6 + (radius(m) - 2.6) * k) * z, fill: blend(C.point, shade(m), k) });
          } else {
            // A point shows once it is inserted.
            if (k < 1 && j >= k * N) continue;
            const m = mOf(j);
            Draw.dot(ctx, M, pts[j], { r: radius(m) * z, fill: mode === 'fixed' ? C.point : shade(m) });
          }
        }
      }
      // Colour of a point with budget m: the density hue, lighter for a small M,
      // darker for a large one (solid colours, so overlaps stay clean).
      const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
      const blend = (a, b, t) => { const A = rgb(a), B2 = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B2[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
      const shade = m => blend(C.surface, C.density, 0.35 + 0.65 * (m - B.mStart) / Math.max(1, B.mEnd - B.mStart));
      // The heat map: a kernel density estimate of the points on a coarse grid,
      // drawn smoothed. Denser = deeper amber.
      let heatImg = null;
      function heatMap() {
        if (heatImg) return heatImg;
        const gw = 96, gh = Math.round(gw / aspect), hh = 0.036, field = new Float32Array(gw * gh);
        let top = 0;
        for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
          const px = (x + 0.5) / gw * aspect, py = (y + 0.5) / gh;
          let s = 0;
          for (const p of pts) { const dx = p[0] - px, dy = p[1] - py, d2 = dx * dx + dy * dy; if (d2 < 9 * hh * hh) s += Math.exp(-d2 / (2 * hh * hh)); }
          field[y * gw + x] = s; if (s > top) top = s;
        }
        const c = document.createElement('canvas');
        c.width = gw; c.height = gh;
        const cx = c.getContext('2d'), img = cx.createImageData(gw, gh), [r0, g0, b0] = rgb(C.amber);
        for (let i = 0; i < field.length; i++) {
          const f = Math.pow(field[i] / top, 0.75);
          img.data.set([r0, g0, b0, Math.round(255 * 0.6 * f)], i * 4);
        }
        cx.putImageData(img, 0, 0);
        return (heatImg = c);
      }
      function heat(ctx, M, near, a) {
        if (a <= 0) return;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(heatMap(), M.x([0, 0]), M.y([0, 0]), M.x([aspect, 0]) - M.x([0, 0]), M.y([0, 1]) - M.y([0, 0]));
        ctx.restore();
      }
      // The close-up looks at the most crowded spot that the box does not cover.
      let focus = null;
      function focusPoint() {
        if (focus != null) return focus;
        let best = Infinity;
        dens.forEach((d, j) => { if (d < best) { best = d; focus = j; } });
        return focus;
      }

      function render(i, kRaw) {
        frame = { i, k: kRaw };
        const { ctx, w, h } = cv;
        ctx.clearRect(0, 0, w, h);
        const g = graph(), step = STEPS[mode][i];
        const [k, zk] = App.split(kRaw, segs()[i].main);
        const sub = T.sub;
        paint(V, () => true, g, step, k, 1);
        if (step === 2 && zk > 0 && App.zoomOn) {
          const c = pts[focusPoint()], near = p => HN.dist(p, c) < ZR;
          const count = gr => layer0(gr).filter(e => inside(near, e)).length;
          Draw.magnifier(ctx, V, { center: c, radius: ZR, box: Draw.quietCorner(V, w, h, pts, c, ZR, [320, 250]), grow: zk,
                                   title: T.zoom[0], sub: T.zoom[1](count(fixed), count(adaptive)), draw: (M, nr) => paint(M, nr, g, step, 1, 1.6) });
        }
        const e = edgeCount(g);
        const text = step === 0 ? sub.density
          : step === 1 ? sub.budget(B.mStart, B.mEnd)
          : k < 1 ? (mode === 'fixed' ? sub.buildFixed(MV) : sub.build)
          : mode === 'fixed' ? sub.doneFixed(e.toLocaleString('ko-KR'))
          : sub.done(e.toLocaleString('ko-KR'), pct(e, edgeCount(fixed)));
        App.caption(ui.subtitle, text);
      }
      const pct = (a, b) => (a < b ? '−' : '+') + Math.abs(Math.round(100 * (a - b) / b)) + ' %';

      function metrics() {
        const eF = edgeCount(fixed), eA = edgeCount(adaptive);
        App.count(ui.q('#dn-edges'), mode === 'fixed' ? eF : eA);
        ui.q('#dn-edges-note').textContent = T.edgesNote(eF.toLocaleString('ko-KR'), `${eA.toLocaleString('ko-KR')} (${pct(eA, eF)})`);
        const rF = 100 * fixed.recall(Q, K, ef), rA = 100 * adaptive.recall(Q, K, ef);
        App.count(ui.q('#dn-rec'), mode === 'fixed' ? rF : rA, { digits: 1, unit: '<small>%</small>' });
        ui.q('#dn-rec-note').textContent = T.recallNote(rF.toFixed(1) + ' %', rA.toFixed(1) + ' %');
        ui.q('#dn-range').textContent = mode === 'fixed' ? `M ${MV}` : T.range(B.mStart, B.mEnd);
        // The M range as a bar on a 1-16 scale, the fixed M as a tick.
        const at = m => `${(m - 1) / 15 * 100}%`;
        const seg = ui.q('#dn-mrange .mr-seg');
        seg.style.left = at(mode === 'fixed' ? MV : B.mStart);
        seg.style.width = mode === 'fixed' ? '0%' : `${(B.mEnd - B.mStart) / 15 * 100}%`;
        ui.q('#dn-mrange .mr-fixed').style.left = at(MV);
        ui.q('#dn-lambda-help').textContent = T.lambdaHelp(B.cv.toFixed(2), MV);
      }
      function syncControls() {
        ui.q('#dn-mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
        for (const [id, v, lo, hi] of [['dn-lambda', lambda, 0.25, 2], ['dn-ef', ef, 10, 40]]) {
          const el = ui.q('#' + id);
          el.value = v;
          el.style.setProperty('--fill', ((v - lo) / (hi - lo) * 100) + '%');
          ui.q('#' + id + '-v').textContent = id === 'dn-ef' ? v : v.toFixed(2);
        }
        ui.q('#dn-lambda').disabled = mode === 'fixed';
        legendFor(mode === 'fixed' ? 2 : 0);
      }
      // The legend lists what the current step draws.
      function legendFor(step) {
        const L = T.legend;
        App.setLegend(ui, mode === 'fixed' ? [['k-point', L.point], ['k-link', L.link], ['', L.fixedAll(MV)]]
          : step === 0 ? [['k-point', L.point], ['k-heat', L.heat]]
          : step === 1 ? [['k-heat', L.heat], ['k-dense', L.dense], ['k-sparse', L.sparse]]
          : [['k-dense', L.dense], ['k-sparse', L.sparse], ['k-link', L.link], ['', L.cap]]);
      }

      let player;
      const syncTransport = App.bindTransport(ui.transport, () => player);
      const segs = () => STEPS[mode].map(s => (s === 2 ? App.withZoom({ dur: 8000 }) : { dur: [5200, 4200][s] }));
      function onChange(st) {
        syncTransport(st);
        const list = STEPS[mode], cur = list[st.i];
        legendFor(cur);
        ui.q('#dn-steps').querySelectorAll('li').forEach((li, j) => {
          const skip = !list.includes(j);
          const done = !skip && (j < cur || (j === cur && st.k >= 1 && !st.playing && j === 2));
          li.classList.toggle('skip', skip);
          li.classList.toggle('active', !skip && j === cur && !done);
          li.classList.toggle('done', done);
          li.querySelector('.tagline').hidden = !skip;
          li.querySelector('.n').textContent = done ? '✓' : j + 1;
          if (skip) li.removeAttribute('data-seg'); else li.dataset.seg = list.indexOf(j);
        });
      }
      function restart() {
        syncControls();
        metrics();
        player.setSegments(segs());
        if (App.step != null) return player.show(Math.max(0, STEPS[mode].indexOf(App.step)), App.params.has('k') ? +App.params.get('k') : 1);
        player.playAll();
      }

      rebuild();
      player = App.player({ segments: segs(), render, onChange });
      restart();

      ui.q('#dn-mode').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b || b.dataset.mode === mode) return;
        mode = b.dataset.mode;
        restart();
      });
      ui.q('#dn-steps').addEventListener('click', e => {
        const li = e.target.closest('li[data-seg]');
        if (li) player.goto(+li.dataset.seg);
      });
      for (const id of ['dn-lambda', 'dn-ef']) {
        ui.q('#' + id).addEventListener('input', e => {
          e.target.style.setProperty('--fill', ((e.target.value - e.target.min) / (e.target.max - e.target.min) * 100) + '%');
          ui.q('#' + id + '-v').textContent = id === 'dn-ef' ? e.target.value : (+e.target.value).toFixed(2);
        });
      }
      // A new lambda reopens the M range: flash it and replay from "links" so the dots visibly change size.
      ui.q('#dn-lambda').addEventListener('change', e => {
        lambda = +e.target.value;
        rebuild();
        metrics();
        const box = ui.q('#dn-mrange');
        box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
        player.setSegments(segs());
        player.playFrom(mode === 'fixed' ? 0 : 1);
      });
      ui.q('#dn-ef').addEventListener('change', e => { ef = +e.target.value; metrics(); });

      return {
        resize() { cv = Draw.setup(ui.canvas, App.pixelZoom()); V = Draw.view(cv.w, cv.h, aspect, PAD); render(frame.i, frame.k); },
        unmount() { player.stop(); },
      };
    },
  });
})();
</script>
<script>
// Update Repair (PRO-HNSW, Chapter 4). Two copies of one graph take the same
// update: a share of the points is marked deleted and fresh points reuse the
// vacated slots (hnswlib's replace_deleted). One copy stops there; the other
// follows Chapter 4's order, ROE before the reinsertion and RDN then RUE after
// it (knowhere_adapter/unified_hnsw.h). Each stage is kept as a snapshot of
// layer 0 and drawn as one step of the animation.
(function () {
  'use strict';
  let T;   // the current language's copy, read on mount
  const N = 240, M = 2, EFC = 40, K = 10, EF = 12, NQ = 200, TRIES = 40;
  const SEED = App.params.has('seed') ? App.seed : 8;   // a layout where every step has clear work to show
  const PAD = [76, 44, 124, 44];   // the bottom band stays free for the caption
  const STAGES = { van: [0, 1, 3], rep: [0, 1, 2, 3, 4, 5] };
  const MOVE = 2800, HOLD = 3500, ZOOM_HOLD = 6500;   // ms per stage, pause after it, longer when a close-up shows
  const DELETE = 4200, INSERT = 5200;                  // the delete stage (points, then their links); the insert stage (one point after another)
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  const snap = g => ({ pts: g.pts.slice(), dead: g.dead.slice(), links: g.links.map(l => l[0].slice()) });
  function unreachable(g) {
    const seen = g.reachable(), out = [];
    for (let i = 0; i < g.size; i++) if (!g.dead[i] && !seen[i]) out.push(i);
    return out;
  }

  // One update round on g, kept stage by stage:
  // 0 before · 1 marked · 2 after ROE · 3 reinserted · 4 after RDN · 5 after RUE.
  function round(g, ids, fresh, repair, Q) {
    const st = { ids: new Set(ids), unr: {} };
    st[0] = snap(g); st.unr[0] = unreachable(g);
    ids.forEach(i => g.markDelete(i));
    st[1] = snap(g); st.unr[1] = unreachable(g);
    st.roe = repair ? g.removeObsoleteEdges(ids).filter(e => e[2] === 0) : [];
    st[2] = snap(g); st.unr[2] = unreachable(g);
    // The lines (either direction) touching a deleted point, and the ones ROE
    // leaves: a live point's link into a deleted one, kept so that the live
    // point is not left without neighbours. The rest go with the deleted points.
    const pairs = new Map();
    st[1].links.forEach((L, u) => { for (const v of L) if (st.ids.has(u) || st.ids.has(v)) pairs.set(u < v ? u + ',' + v : v + ',' + u, [Math.min(u, v), Math.max(u, v)]); });
    const held = (a, b) => !g.dead[a] && g.links[a][0].includes(b);
    st.cut = [...pairs.values()];
    st.keptLines = repair ? st.cut.filter(([u, v]) => held(u, v) || held(v, u)) : st.cut;
    st.roeLines = repair ? st.cut.filter(([u, v]) => !held(u, v) && !held(v, u)) : [];
    st.order = new Map(ids.map((id, j) => [id, j]));
    fresh.forEach(p => g.replace(p));
    st[3] = snap(g); st.unr[3] = unreachable(g);
    // A link touching a reused slot is stale when it now reaches at least twice as
    // far as it did between the old places: it was held before and followed the
    // id, or updatePoint re-picked it around a slot's old neighbourhood. Either
    // way it runs from an old place to a far new point.
    const old = st[2].pts;
    st.stale = [];
    for (let u = 0; u < g.size; u++) if (!g.dead[u]) for (const v of g.links[u][0]) {
      if ((st.ids.has(u) || st.ids.has(v)) && HN.dist(g.pts[u], g.pts[v]) > Math.max(0.08, 2 * HN.dist(old[u], old[v]))) st.stale.push([u, v]);
    }
    st.rdn = repair ? g.repairDisconnectedNodes().filter(e => e[2] === 0) : [];
    st[4] = snap(g); st.unr[4] = unreachable(g);
    st.rue = repair ? g.resolveEdgeAsymmetry() : [];
    st[5] = snap(g); st.unr[5] = unreachable(g);
    st.recall = g.recall(Q, K, EF);
    return st;
  }

  App.register('repair', {
    mount(stage) {
      T = STR.repair;
      const ui = App.layout(stage, {
        kicker: T.kicker, meta: T.meta, title: T.title, lead: T.lead, transport: true, zoom: true, cite: App.cite('pro'),
        legend: [['k-point', T.legend.point], ['k-del', T.legend.hole], ['k-cut', T.legend.cut],
                 ['k-lost', T.legend.lost], ['k-repair', T.legend.fix]],
        body: `<ol class="steps compact" id="rp-steps">${T.steps.map(([b, s], i) =>
                 `<li style="--step: var(--${['broken', 'amber', 'query', 'repair', 'magenta'][i]})"><span class="n">${i + 1}</span><div><b>${b}</b><span>${s}</span><em class="tagline" hidden>${T.skipped}</em></div></li>`).join('')}</ol>
               <div class="controls">
                 <div class="row"><div class="seg" id="rp-mode">${T.modes.map((m, i) =>
                   `<button data-mode="${i ? 'rep' : 'van'}">${m}</button>`).join('')}</div></div>
                 <label class="field"><div class="field-head">${T.ratio} <b id="rp-ratio-v"></b></div>
                   <input type="range" id="rp-ratio" min="5" max="40" step="5" value="20"></label>
                 <div class="hint">${T.hint}</div>
               </div>`,
        metrics: `<div class="metric"><div class="label">${T.unreach}</div><div class="value" id="rp-unr"></div><div class="note" id="rp-unr-note"></div></div>
                  <div class="metric sm"><div class="label">${T.recall}</div><div class="value" id="rp-rec"></div><div class="note" id="rp-rec-note"></div></div>`,
      });
      const C = Draw.tokens();
      let cv = Draw.setup(ui.canvas, App.pixelZoom());
      const aspect = (cv.w - PAD[1] - PAD[3]) / (cv.h - PAD[0] - PAD[2]);
      let V = Draw.view(cv.w, cv.h, aspect, PAD);

      // Data: islands of points joined by a few bridge points, so that deleting
      // bridges cuts islands off and every repair step has work to show. A pool
      // of fresh points for the update and queries for recall come from the same
      // density.
      const r = HN.rng(SEED * 7919 + 3);
      const islands = Array.from({ length: 7 }, () => [0.12 + r() * (aspect - 0.24), 0.13 + r() * 0.74, 0.05 * (0.8 + 0.4 * r())]);
      const mix = rr => {
        if (rr() < 0.15) return [0.04 + rr() * (aspect - 0.08), 0.05 + rr() * 0.9];
        const c = islands[Math.floor(rr() * islands.length)];
        const p = [c[0] + HN.gauss(rr) * c[2], c[1] + HN.gauss(rr) * c[2]];
        return p[0] > 0.03 && p[0] < aspect - 0.03 && p[1] > 0.04 && p[1] < 0.96 ? p : null;
      };
      const draw = rr => { let p; while (!(p = mix(rr))); return p; };
      const initial = HN.sample(r, N, mix, 0.75 / Math.sqrt(N * 1.6));
      const pool = Array.from({ length: N }, () => draw(r));
      const Q = Array.from({ length: NQ }, () => draw(r));
      const base = new HN.HNSW({ M, efConstruction: EFC, seed: SEED });
      initial.forEach(p => base.add(p));

      let mode = App.params.get('mode') === 'rep' ? 'rep' : 'van';
      let ratio = 0.2, runs, view = null, query = null;

      // One update from the original graph. The points to replace are drawn at
      // random; of a fixed series of draws the one that gives every step the most
      // to show is kept (links ROE keeps, stale links and cut-off points after the
      // plain update, links for RDN and RUE, and RDN bringing points back).
      function update() {
        const live = [];
        for (let i = 0; i < base.size; i++) if (i !== base.entry) live.push(i);
        let best = null, bestScore = -1;
        for (let t = 0; t < TRIES; t++) {
          const pick = HN.rng(SEED * 31 + t * 977 + Math.round(ratio * 100));
          const ids = HN.shuffle(pick, live.slice()).slice(0, Math.round(ratio * live.length));
          const fresh = pool.slice(0, ids.length);
          const van = base.clone(), rep = base.clone();
          van.last = round(van, ids, fresh, false, Q);
          rep.last = round(rep, ids, fresh, true, Q);
          const a = van.last, b = rep.last;
          const part = (n, want) => Math.min(n, want) / want;
          const score = part(b.rdn.length, 12) + part(b.unr[3].length, 6) + part(b.rue.length, 12) + part(b.keptLines.length, 3)
            + part(a.stale.length, 8) + part(a.unr[3].length, 6) + (b.unr[5].length < a.unr[3].length ? 1 : 0);
          if (score > bestScore) { bestScore = score; best = { van, rep }; }
        }
        runs = best;
        query = null;
      }

      // ---- drawing ----
      const partial = (a, b, k) => [a, [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]];
      // Directed links for the RUE step: a line that grows from its source with a
      // small head at the tip, stopping short of the target point.
      function arrows(ctx, list, color, width, k = 1, M = V, head = 6) {
        if (!list.length) return;
        ctx.save();
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
        for (const [a, b] of list) {
          const x0 = M.x(a), y0 = M.y(a), x1 = M.x(b), y1 = M.y(b), L = Math.hypot(x1 - x0, y1 - y0);
          if (L < 10) continue;
          const ux = (x1 - x0) / L, uy = (y1 - y0) / L, len = (L - 5) * k;
          const tx = x0 + ux * len, ty = y0 + uy * len;
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(tx, ty); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx - ux * head - uy * head * 0.55, ty - uy * head + ux * head * 0.55);
          ctx.lineTo(tx - ux * head + uy * head * 0.55, ty - uy * head - ux * head * 0.55);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }

      // Each step paints what it changes in its own colour (the step's number in the
      // panel takes the same colour) and dims the rest of the graph.
      const ZR = 0.09;
      function lines(ctx, M, list, color, width, dash) {
        if (!list.length) return;
        ctx.save();
        ctx.strokeStyle = color; ctx.lineWidth = width;
        if (dash) ctx.setLineDash(dash);
        ctx.beginPath();
        for (const [a, b] of list) { ctx.moveTo(M.x(a), M.y(a)); ctx.lineTo(M.x(b), M.y(b)); }
        ctx.stroke();
        ctx.restore();
      }
      // Insert: the new points move one after another, each starting while the
      // one before is still on its way. moved(st, i, k) is point i's share of its move.
      const GO = 0.3;
      const moved = (st, i, k) => Math.max(0, Math.min(1, (k - st.order.get(i) / Math.max(1, st.ids.size - 1) * (1 - GO)) / GO));
      const positions = (st, s, k) => {
        const old = st[0].pts, ids = st.ids;
        if (s < 3) return old;
        return st[3].pts.map((p, i) => {
          if (!ids.has(i) || s > 3) return p;
          const t = ease(moved(st, i, k));
          return [old[i][0] + (p[0] - old[i][0]) * t, old[i][1] + (p[1] - old[i][1]) * t];
        });
      };

      // Draws stage s at progress k through map M; near(p) limits it to a close-up, z enlarges marks.
      // Nothing pops in or out: what a stage changes first takes that stage's colour
      // where it is, then moves, fades or turns into what comes next.
      const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
      const blend = (a, b, t) => { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
      function line(ctx, M, a, b, color, width, dash) {
        ctx.save();
        ctx.strokeStyle = color; ctx.lineWidth = width;
        if (dash) ctx.setLineDash(dash);
        ctx.beginPath(); ctx.moveTo(M.x(a), M.y(a)); ctx.lineTo(M.x(b), M.y(b)); ctx.stroke();
        ctx.restore();
      }
      function paint(ctx, M, near, st, s, k, pos, z) {
        const S = st[s], ids = st.ids;
        const keep = (u, v) => near(pos[u]) || near(pos[v]);
        const mv = i => (!ids.has(i) ? 1 : s === 3 ? moved(st, i, k) : s > 3 ? 1 : 0);
        const dash = [3 * z, 4 * z];
        // Delete: the points turn red first, then their lines turn into red dashes.
        const redK = s === 1 ? Math.min(1, k / 0.4) : 1, cutK = s === 1 ? Math.max(0, (k - 0.45) / 0.55) : 1;
        // ROE: the lines it clears light up yellow, let go of the deleted point and are gone.
        const on = s === 2 ? Math.min(1, k / 0.35) : 1, off = s === 2 ? Math.max(0, (k - 0.45) / 0.55) : 1;

        // Lines not touching a deleted point (from stage 3 on, every line of the graph).
        const staleKey = new Set(s >= 3 ? st.stale.map(([u, v]) => u + ',' + v) : []);
        const gray = [], done = new Set();
        (s >= 3 ? S.links : st[1].links).forEach((L, u) => {
          for (const v of L) {
            if (!keep(u, v) || (s < 3 && (ids.has(u) || ids.has(v)))) continue;
            const key = u < v ? u + ',' + v : v + ',' + u, w = Math.min(mv(u), mv(v));
            if (staleKey.has(u + ',' + v)) { if (w > 0) line(ctx, M, pos[u], pos[v], Draw.alpha(C.broken, 0.8 * w), 1.25 * z, dash); continue; }
            if (done.has(key)) continue;
            done.add(key);
            if (s === 3 && (ids.has(u) || ids.has(v))) { if (w > 0) line(ctx, M, pos[u], pos[v], Draw.alpha(C.query, 0.55 * w), 1.25 * z); }
            else gray.push([pos[u], pos[v]]);
          }
        });
        lines(ctx, M, gray, Draw.alpha(C.ink, s === 1 ? 0.13 - 0.05 * k : s ? 0.08 : 0.13), z);

        // Lines touching a deleted point, until the new points take the slots over.
        if (s >= 1 && s <= 3) {
          const kept = new Set(st.keptLines.map(([u, v]) => u + ',' + v));
          for (const [u, v] of st.cut) {
            if (!keep(u, v)) continue;
            const isKept = kept.has(u + ',' + v);
            if (s === 1) {
              line(ctx, M, pos[u], pos[v], Draw.alpha(C.ink, 0.13 * (1 - cutK)), z);
              line(ctx, M, pos[u], pos[v], Draw.alpha(C.broken, 0.8 * cutK), 1.25 * z, dash);
            } else if (s === 2) {
              if (isKept) { line(ctx, M, pos[u], pos[v], Draw.alpha(C.broken, 0.8), 1.25 * z, dash); continue; }
              // From red to yellow, then the yellow line shrinks back to the live end and is gone.
              if (on < 1) line(ctx, M, pos[u], pos[v], Draw.alpha(C.broken, 0.8 * (1 - on)), 1.25 * z, dash);
              if (off < 1) {
                const [a, b] = ids.has(u) && !ids.has(v) ? [pos[v], pos[u]] : [pos[u], pos[v]];
                line(ctx, M, ...partial(a, b, 1 - off), Draw.alpha(C.amber, 0.95 * on), 2.25 * z);
              }
            } else if (isKept) {
              const w = 1 - Math.max(ids.has(u) ? mv(u) : 0, ids.has(v) ? mv(v) : 0);
              if (w > 0) line(ctx, M, st[0].pts[u], st[0].pts[v], Draw.alpha(C.broken, 0.8 * w), 1.25 * z, dash);
            }
          }
        }

        const lost = new Set(st.unr[s]);
        const wasLost = s === 4 ? new Set(st.unr[3]) : s === 5 ? new Set(st.unr[4]) : null;
        const lostK = s === 3 ? Math.max(0, (k - 0.85) / 0.15) : 1;
        // Direction where reachability is the point: out of a cut-off point the
        // links lead away, and nothing outside leads in.
        if (s === 3 || s === 4) {
          const out = [], from = s === 3 ? lost : new Set(st.unr[3]);
          for (const i of from) if (!S.dead[i]) for (const v of S.links[i]) if (keep(i, v)) out.push([pos[i], pos[v]]);
          arrows(ctx, out, Draw.alpha(C['ink-2'], (z > 1 ? 0.9 : 0.55) * lostK), z, 1, M, 6 * z);
        }
        if (s >= 4) {
          const rdn = st.rdn.filter(([u, v]) => keep(u, v)).map(([u, v]) => [pos[u], pos[v]]);
          arrows(ctx, rdn, s === 4 ? C.repair : Draw.alpha(C.repair, 0.6), 2 * z, s === 4 ? k : 1, M, 7 * z);
        }
        if (s === 5) {
          // One-way links before RUE (u -> v while v has no link back), then the reverse links RUE adds.
          const L4 = st[4].links, oneWay = [];
          L4.forEach((Lu, u) => { if (!st[4].dead[u]) for (const v of Lu) if (!st[4].dead[v] && !L4[v].includes(u) && keep(u, v)) oneWay.push([pos[u], pos[v]]); });
          arrows(ctx, oneWay, Draw.alpha(C['ink-2'], z > 1 ? 0.85 : 0.35), z, 1, M, 6 * z);
          arrows(ctx, st.rue.filter(([v, u]) => keep(v, u)).map(([v, u]) => [pos[v], pos[u]]), Draw.alpha(C.magenta, z > 1 ? 1 : 0.6), 1.25 * z, k, M, 6 * z);
        }

        const plain = blend(C.surface, C.point, s === 1 ? 1 - 0.4 * k : s ? 0.6 : 1);
        for (let i = 0; i < pos.length; i++) {
          if (!near(pos[i])) continue;
          if (ids.has(i) && s >= 1 && s <= 3) {
            const t = mv(i);
            if (s === 1) Draw.dot(ctx, M, pos[i], { r: (3 + 0.8 * redK) * z, fill: blend(C.point, C.broken, redK) });
            else if (t <= 0) Draw.dot(ctx, M, pos[i], { r: 3.8 * z, fill: C.broken });
            else Draw.dot(ctx, M, pos[i], { r: 3.6 * z, fill: blend(C.broken, C.query, Math.min(1, t / 0.3)), ring: 1.5 });
            continue;
          }
          if (S.dead[i]) continue;
          Draw.dot(ctx, M, pos[i], { r: 3 * z, fill: plain });
        }
        // Cut-off points: a red ring around the point. Once RDN reaches one, its ring turns green.
        for (const i of lost) if (near(pos[i]) && lostK > 0) Draw.ring(ctx, M, pos[i], { r: 8 * z, color: Draw.alpha(C.broken, 0.9 * lostK), width: 2 });
        if (wasLost) for (const i of wasLost) if (!lost.has(i) && near(pos[i])) {
          const t = s === 4 ? k : 1;
          if (t < 1) Draw.ring(ctx, M, pos[i], { r: 8 * z, color: Draw.alpha(C.broken, 0.9 * (1 - t)), width: 2 });
          Draw.ring(ctx, M, pos[i], { r: 8 * z, color: Draw.alpha(C.repair, 0.9 * t), width: 2.2 });
        }
      }

      // Where the close-up looks at each stage: the spot with the most of what that
      // stage changes, kept clear of the close-up box itself.
      function focusOf(st, s) {
        if (s < 2) return null;
        const key = 'focus' + s;
        if (st[key] !== undefined) return st[key];
        const P = st[s].pts;
        const free = () => true;
        const near = (i, j) => HN.dist(P[i], P[j]) < ZR;
        let cand, score;
        if (s === 2) {
          // A deleted point with cleared lines around it, and a kept one nearby if possible.
          cand = [...st.ids];
          const inBox = list => i => list.filter(([u, v]) => near(i, u) && near(i, v)).length;
          score = i => inBox(st.roeLines)(i) + 3 * Math.min(1, inBox(st.keptLines)(i));
        }
        else if (s === 3) {
          // An unreachable point when there is one, otherwise the end of a stale
          // link. Preferred: one whose way out shows inside the box and, with
          // repair, one RDN brings back, so the next close-up shows the same point.
          st.focusStale = !st.unr[3].length;
          cand = st.focusStale ? st.stale.map(e => e[0]) : st.unr[3];
          const back = i => !st.unr[4].includes(i) && st.rdn.some(([u, v]) => v === i && near(i, u));
          score = st.focusStale ? i => 1 + st.stale.filter(([u]) => near(i, u)).length
            : i => 1 + 2 * st[3].links[i].filter(v => near(i, v)).length + (back(i) ? 6 : 0);
        }
        else if (s === 4) {
          const f3 = focusOf(st, 3);
          if (f3 != null && !st.unr[4].includes(f3)) return (st[key] = f3);
          cand = st.unr[3].filter(i => !st.unr[4].includes(i)); score = i => st.rdn.filter(([u, v]) => near(i, u) && near(i, v)).length;
        }
        else { cand = st.rue.map(e => e[1]); score = i => st.rue.filter(([u, v]) => near(i, u) && near(i, v)).length; }
        let best = null, top = 0;
        for (const i of cand.filter(free)) { const v = score(i); if (v > top) { top = v; best = i; } }
        st[key] = best;
        return best;
      }

      // zk plays the close-up in once the stage's own animation (k) is over.
      function render(s, k, zk = 1) {
        view = { s, k, zk };
        const { ctx, w, h } = cv;
        ctx.clearRect(0, 0, w, h);
        const st = runs[mode].last;
        if (!st) { renderBase(); return; }
        const pos = positions(st, s, k);
        paint(ctx, V, () => true, st, s, k, pos, 1);
        drawEntry(pos);
        if (query) drawQuery();
        const f = focusOf(st, s);
        if (f != null && !query && App.zoomOn && zk > 0) {
          const [title, sub] = s === 3 && st.focusStale ? T.zoom.stale : T.zoom[s], P = st[s].pts, c = P[f];
          Draw.magnifier(ctx, V, { center: c, radius: ZR, box: Draw.quietCorner(V, w, h, P.filter((p, i) => !st[s].dead[i]), c, ZR, [320, 250]),
                                   grow: zk, title, sub, draw: (M, near) => paint(ctx, M, near, st, s, s === 2 ? 0.4 : k, pos, 1.6) });
        }
        metrics(st, s);
      }

      function renderBase() {
        const g = runs[mode];
        Draw.links(cv.ctx, V, g);
        for (let i = 0; i < g.size; i++) Draw.dot(cv.ctx, V, g.pts[i], { r: 2.6, fill: C.point });
        drawEntry(g.pts);
        if (query) drawQuery();
        metrics(null, 0);
      }

      function drawEntry(pos) {
        const e = pos[base.entry];
        Draw.dot(cv.ctx, V, e, { r: 5.5, fill: C.ink, ring: 2 });
        Draw.text(cv.ctx, T.start, V.x(e) + 10, V.y(e) - 13, { size: 14, color: C.ink });
      }

      function drawQuery() {
        const { ctx } = cv, g = runs[mode], q = query.q;
        Draw.walk(ctx, V, query.trace.path.map(i => g.pts[i]), { width: 2.25 });
        for (const id of query.truth) if (!query.found.has(id)) Draw.ring(ctx, V, g.pts[id], { r: 7, color: C.broken, width: 1.75, dash: [3, 3] });
        for (const id of query.found) Draw.ring(ctx, V, g.pts[id], { r: 7 });
        Draw.query(ctx, V, q);
      }

      function metrics(st, s) {
        const live = runs[mode].size - runs[mode].ndead;
        const u = st ? st.unr[s].length : 0;
        App.count(ui.q('#rp-unr'), u, { unit: `<small>${STR.unit.count}</small>` });
        ui.q('#rp-unr-note').textContent = T.unreachNote(live, (100 * (live - u) / live).toFixed(1));
        const final = !st || s === STAGES[mode][STAGES[mode].length - 1];
        const rec = st ? runs[mode].last.recall : null;
        if (final && st) App.count(ui.q('#rp-rec'), 100 * rec, { digits: 1, unit: '<small>%</small>' });
        else if (!st) { ui.q('#rp-rec').textContent = '–'; delete ui.q('#rp-rec').dataset.v; }
        ui.q('#rp-rec-note').innerHTML = st ? T.recallNote((100 * runs.van.last.recall).toFixed(1) + ' %', (100 * runs.rep.last.recall).toFixed(1) + ' %') : '';
      }

      // ---- panel state ----
      function steps(s) {
        const list = STAGES[mode];
        ui.q('#rp-steps').querySelectorAll('li').forEach((li, i) => {
          const st = i + 1, skip = !list.includes(st);
          if (skip || !runs[mode].last) li.removeAttribute('data-seg'); else li.dataset.seg = list.indexOf(st) - 1;
          li.classList.toggle('skip', skip);
          li.classList.toggle('active', !skip && st === s);
          li.classList.toggle('done', !skip && st < s);
          li.querySelector('.tagline').hidden = !skip;
          li.querySelector('.n').textContent = !skip && st < s ? '✓' : st;
        });
      }
      function caption(s) {
        const st = runs[mode].last;
        if (!st || s === 0) { App.caption(ui.subtitle, ''); return; }
        const sub = T.sub;
        const text = s === 1 ? sub.del(st.ids.size)
          : s === 2 ? sub.roe(st.roeLines.length, st.keptLines.length)
          : s === 3 ? (mode === 'van' ? sub.insVan(st.stale.length, st.unr[3].length) : sub.insRep(st.unr[3].length))
          : s === 4 ? sub.rdn(st.rdn.length) : sub.rue(st.rue.length);
        App.caption(ui.subtitle, text);
      }
      function syncControls() {
        ui.q('#rp-mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
        const slider = ui.q('#rp-ratio');
        slider.value = Math.round(ratio * 100);
        slider.style.setProperty('--fill', ((slider.value - 5) / 35 * 100) + '%');
        ui.q('#rp-ratio-v').textContent = slider.value + ' %';

      }

      // The player steps through the stages after "before"; each is one segment.
      const stagesOf = () => STAGES[mode].slice(1);
      const segs = () => stagesOf().map(s => (s >= 2 ? { ...App.withZoom({ dur: s === 3 ? INSERT : MOVE }), hold: ZOOM_HOLD } : { dur: DELETE, hold: HOLD }));
      let player;
      const syncTransport = App.bindTransport(ui.transport, () => player);
      function frameAt(i, k) {
        if (!runs[mode].last) { render(0, 1); return; }
        const [m, z] = App.split(k, segs()[i].main);
        render(stagesOf()[i], ease(m), z);
      }
      function onChange(st) {
        syncTransport(st);
        const s = runs[mode].last ? stagesOf()[st.i] : 0;
        steps(s);
        caption(s);
        legendFor(s);
      }
      // The legend lists what the current stage draws.
      function legendFor(s) {
        const L = T.legend, P = ['k-point', L.point];
        App.setLegend(ui, ({
          0: [P],
          1: [P, ['k-del', L.hole], ['k-cut', L.cut]],
          2: [P, ['k-del', L.hole], ['k-amber', L.roe], ['k-cut', L.kept]],
          3: [P, ['k-new', L.newp], ['k-cut', L.stale], ['k-lost', L.lost], ['k-arrow', L.dir]],
          4: [P, ['k-lost', L.lost], ['k-back', L.back], ['k-repair-arrow', L.fix]],
          5: [P, ['k-arrow', L.oneway], ['k-magenta-arrow', L.rue]],
        })[s] || [P]);
      }
      player = App.player({ segments: segs(), render: frameAt, onChange, hold: HOLD });

      function play() {
        syncControls();
        player.setSegments(segs());
        if (!runs[mode].last) { player.stop(); steps(0); caption(0); render(0, 1); return; }
        if (App.step != null) {
          const j = stagesOf().indexOf(App.step);
          player.show(j >= 0 ? j : stagesOf().length - 1, App.params.has('k') ? +App.params.get('k') : 1);
          return;
        }
        player.playAll();
      }
      function finish() {
        syncControls();
        player.setSegments(segs());
        player.show(stagesOf().length - 1, 1);
      }

      if (App.params.has('ratio')) ratio = +App.params.get('ratio') / 100;
      update();
      play();

      // ---- interaction ----
      ui.q('#rp-mode').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b || b.dataset.mode === mode) return;
        mode = b.dataset.mode;
        query = null;
        play();
      });
      // The label follows the thumb; the update runs once the thumb is released.
      ui.q('#rp-ratio').addEventListener('input', e => {
        e.target.style.setProperty('--fill', ((e.target.value - 5) / 35 * 100) + '%');
        ui.q('#rp-ratio-v').textContent = e.target.value + ' %';
      });
      ui.q('#rp-ratio').addEventListener('change', e => {
        ratio = +e.target.value / 100;
        player.stop();
        update();
        finish();
      });

      ui.q('#rp-steps').addEventListener('click', e => {
        const li = e.target.closest('li[data-seg]');
        if (li) player.goto(+li.dataset.seg);
      });
      ui.canvas.addEventListener('pointerdown', e => {
        const [x, y] = Draw.pointer(ui.canvas, e);
        const g = runs[mode], q = V.inv(x, y);
        const { ids, trace } = g.search(q, K, EF, { trace: true });
        const truth = g.bruteForce(q, K);
        query = { q, trace, truth, found: new Set(ids.filter(id => truth.includes(id))) };
        if (runs[mode].last) player.show(stagesOf().length - 1, 1);
        else { player.stop(); render(0, 1); }
        App.caption(ui.subtitle, T.sub.query(query.found.size, K));
      });
      ui.canvas.style.cursor = 'crosshair';

      return {
        resize() { cv = Draw.setup(ui.canvas, App.pixelZoom()); V = Draw.view(cv.w, cv.h, aspect, PAD); if (view) render(view.s, view.k, view.zk); },
        unmount() { player.stop(); },
      };
    },
  });
})();
</script>
<script>
// Cache Alignment and Query Shortcuts (CAMP-HNSW, Chapter 5). The data lies on
// two thin bands and the queries come from the empty strip between them, the 2-D
// picture of an out-of-distribution workload (text queries over image data, say).
// Phase 1 packs the vectors in memory cluster by cluster (MiniBatchKMeans in
// ours_utils.reorder_dataset_by_clustering), so the points one search reads sit
// in fewer memory blocks; the 2-D demo keeps the graph and shows the layout only.
// Then past queries from the strip are searched once, every retrieved point is
// paired with the true neighbours the search missed, and the pairs that pass the
// heuristic are injected into the graph (HNSW.mineShortcuts / injectShortcuts,
// after ours_backend.cpp and hnswalg.h). With CAMP on, the scene plays that
// process: align, search, mine, inject, then a new query crossing on a shortcut.
(function () {
  'use strict';
  let T;   // the current language's copy, read on mount
  const N = 450, M = 2, EFC = 40, K = 10, EF = 12, BUDGET = 6, NTRAIN = 300, NTEST = 150;
  const SEED = App.params.has('seed') ? App.seed : 3, LO = 0.25, HI = 0.75;   // bands far enough apart that few links cross
  const KM = 8, BLOCK = 16;   // clusters for the memory layout; points per memory block
  // One muted colour per cluster, for the layout step only.
  const CLUSTER = ['#8fb0d6', '#e3a878', '#93c79b', '#c3a2d8', '#d9c06a', '#86c9c0', '#e39c9c', '#a9a9a2'];
  const PAD = [76, 44, 124, 44];   // the bottom band stays free for the caption

  App.register('shortcut', {
    mount(stage) {
      T = STR.shortcut;
      const ui = App.layout(stage, {
        kicker: T.kicker, meta: T.meta, title: T.title, lead: T.lead, transport: true, zoom: true, cite: App.cite('camp'),
        legend: [['k-point', T.legend.point], ['k-train', T.legend.train], ['k-short', T.legend.short],
                 ['k-walk', T.legend.walk], ['k-found', T.legend.found], ['k-missed', T.legend.missed]],
        body: `<ol class="steps compact" id="sc-steps">${T.steps.map(([b, s], i) =>
                 `<li data-seg="${i}" style="--step: var(--${['ink-2', 'query', 'amber', 'shortcut', 'query'][i]})"><span class="n">${i + 1}</span><div><b>${b}</b><span>${s}</span></div></li>`).join('')}</ol>
               <div class="controls">
                 <div class="row"><div class="seg" id="sc-mode">${T.modes.map((m, i) => `<button data-mode="${i ? 'on' : 'off'}">${m}</button>`).join('')}</div><span class="rounds" id="sc-count"></span></div>
                 <label class="field"><div class="field-head">${T.train} <b id="sc-train-v"></b></div>
                   <input type="range" id="sc-train" min="25" max="${NTRAIN}" step="25" value="200"></label>
                 <div class="hint">${T.hint}</div>
               </div>`,
        metrics: `<div class="metric"><div class="label">${T.recall}</div><div class="value" id="sc-rec"></div><div class="note" id="sc-rec-note"></div></div>
                  <div class="metric sm"><div class="label">${T.this}</div><div class="value" id="sc-q"></div><div class="note" id="sc-q-note"></div></div>`,
      });
      const C = Draw.tokens();
      let cv = Draw.setup(ui.canvas, App.pixelZoom());
      const aspect = (cv.w - PAD[1] - PAD[3]) / (cv.h - PAD[0] - PAD[2]);
      let V = Draw.view(cv.w, cv.h, aspect, PAD);

      // Two thin wavy bands of data; queries from the strip between them.
      const band = (x, c) => c + 0.05 * Math.sin(x * 4 + c * 6);
      const data = rr => { const x = 0.03 + rr() * (aspect - 0.06), c = rr() < 0.5 ? LO : HI; return [x, band(x, c) + (rr() - 0.5) * 0.07]; };
      const ood = rr => { const x = 0.06 + rr() * (aspect - 0.12); return [x, 0.5 + 0.05 * Math.sin(x * 4 + 3) + (rr() - 0.5) * 0.06]; };
      const r = HN.rng(SEED * 101 + 7);
      const g = new HN.HNSW({ M, efConstruction: EFC, seed: SEED });
      HN.sample(r, N, data, 0.018 * Math.sqrt(700 / N)).forEach(p => g.add(p));
      const train = Array.from({ length: NTRAIN }, () => ood(r));
      const test = Array.from({ length: NTEST }, () => ood(r));
      const idq = g.pts.slice(0, NTEST).map(p => [p[0] + 0.004, p[1] + 0.004]);
      const offRec = g.recall(test, K, EF), offId = g.recall(idq, K, EF);
      const otherBand = (a, b) => Math.abs(g.pts[a][1] - g.pts[b][1]) > 0.15;

      // ---- mining: shortcuts for the first nTrain training queries ----
      let nTrain = 200, on = App.params.has('on') || App.params.get('mode') === 'on', h, shortcuts, cand, onRec, onId, shortKey, demo;
      function mine() {
        h = g.clone();
        const detail = {};
        const pairs = h.mineShortcuts(train.slice(0, nTrain), K, EF, BUDGET, detail);
        cand = detail.cand;
        h.injectShortcuts(pairs);
        shortKey = new Set();
        shortcuts = [];
        for (const [a, b] of pairs) {
          if (!h.links[a][0].includes(b)) continue;
          shortKey.add(a + ',' + b);
          if (!shortKey.has(b + ',' + a)) shortcuts.push([a, b]);
        }
        onRec = h.recall(test, K, EF);
        onId = h.recall(idq, K, EF);
        // The training query the first step shows: one that misses the most
        // neighbours on the other band.
        let best = -1;
        for (const tq of train.slice(0, nTrain)) {
          const res = g.search(tq, K, EF, { trace: true }), truth = g.bruteForce(tq, K);
          const miss = truth.filter(id => !res.ids.includes(id));
          const across = miss.filter(m => res.ids.some(f => otherBand(f, m))).length;
          if (across > best) { best = across; demo = walkOf(g, tq, res, truth); }
        }
      }
      const isShort = (a, b) => shortKey.has(a + ',' + b) || shortKey.has(b + ',' + a);
      const crosses = path => path.some((v, i) => i > 0 && isShort(path[i - 1], v) && otherBand(path[i - 1], v));

      // A traced search, prepared for drawing.
      function walkOf(gr, q, res, truth) {
        res = res || gr.search(q, K, EF, { trace: true });
        truth = truth || gr.bruteForce(q, K);
        const first = new Map();
        res.trace.evaluated.forEach((e, i) => { if (!first.has(e.id)) first.set(e.id, i); });
        return { q, gr, ids: res.ids, truth, events: res.trace.evaluated, path: res.trace.path,
                 reveal: res.trace.path.map(id => (id === gr.entry ? -1 : first.get(id))),
                 found: res.ids.filter(id => truth.includes(id)).length };
      }

      let q, test0, frame = { i: 0, k: 1 };
      function computeTest() { test0 = walkOf(on ? h : g, q); test0.used = on && crosses(test0.path); }

      // ---- Phase 1, the memory layout: k-means over the points, then memory packed
      // cluster by cluster (clusters ordered along the bands, points in id order) ----
      const label = (() => {
        const rr = HN.rng(SEED * 13 + 1), P = g.pts;
        let cent = [P[Math.floor(rr() * P.length)]];
        while (cent.length < KM) {   // k-means++ seeding
          const d = P.map(p => Math.min(...cent.map(c => HN.dist(p, c))) ** 2), tot = d.reduce((a, b) => a + b, 0);
          let t = rr() * tot, j = 0;
          while (t > d[j]) t -= d[j++];
          cent.push(P[Math.min(j, P.length - 1)]);
        }
        let lab = [];
        for (let it = 0; it < 25; it++) {
          lab = P.map(p => { let b = 0; cent.forEach((c, j) => { if (HN.dist(p, c) < HN.dist(p, cent[b])) b = j; }); return b; });
          cent = cent.map((c, j) => { const m = P.filter((p, i) => lab[i] === j); return m.length ? [m.reduce((a, p) => a + p[0], 0) / m.length, m.reduce((a, p) => a + p[1], 0) / m.length] : c; });
        }
        const rank = cent.map((c, j) => j).sort((a, b) => (cent[a][1] > 0.5) - (cent[b][1] > 0.5) || cent[a][0] - cent[b][0]);
        const as = new Map(rank.map((j, n) => [j, n]));
        return lab.map(j => as.get(j));
      })();
      const slotAfter = (() => {
        const order = g.pts.map((p, i) => i).sort((a, b) => label[a] - label[b] || a - b), out = new Array(g.size);
        order.forEach((id, n) => { out[id] = n; });
        return out;
      })();
      // What one search of the current query reads, and the memory blocks that holds before and after.
      let touched, blocksBefore, blocksAfter;
      function computeTouched() {
        const res = g.search(q, K, EF, { trace: true });
        touched = new Set([g.entry, ...res.trace.evaluated.map(e => e.id)]);
        blocksBefore = new Set([...touched].map(i => Math.floor(i / BLOCK))).size;
        blocksAfter = new Set([...touched].map(i => Math.floor(slotAfter[i] / BLOCK))).size;
      }
      // The layout step: points take their cluster's colour, then the memory grid
      // (one column per block) reorders from insertion order to cluster order.
      function layoutStep(k) {
        const { ctx } = cv, cK = Math.min(1, k / 0.3), mK = Math.max(0, Math.min(1, (k - 0.35) / 0.55));
        links(V, g, () => true, false, 1);
        const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
        const blend = (a, b, t) => { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
        for (let i = 0; i < g.size; i++) {
          Draw.dot(ctx, V, g.pts[i], { r: 3, fill: blend(C.point, CLUSTER[label[i]], cK) });
          if (touched.has(i)) Draw.ring(ctx, V, g.pts[i], { r: 5.5, color: Draw.alpha(C.query, 0.9 * cK), width: 1.6 });
        }
        Draw.query(ctx, V, q);
        Draw.text(ctx, T.query, V.x(q), V.y(q) + 26, { align: 'center', size: 14, color: C.query });
        // Memory before and after, one row each, in the strip between the bands on the
        // side away from the query. A tile is a block of BLOCK points (4 x 4 cells);
        // the tiles this query reads are lit, with their count at the row's end.
        const nb = Math.ceil(g.size / BLOCK), PER = 8, cell = 4, tile = 4 * (cell + 1) + 3, tg = 3, rows = Math.ceil(nb / PER);
        const lab = 64, gridW = PER * (tile + tg), gridH = rows * (tile + tg), cnt = 92;
        const bw = 14 + lab + gridW + cnt, bh = 40 + 2 * gridH + 30;
        const bx = V.x(q) < cv.w / 2 ? cv.w - bw - 36 : 36, by = V.y([0, 0.5]) - bh / 2;
        ctx.save();
        ctx.shadowColor = 'rgba(20, 20, 19, 0.15)'; ctx.shadowBlur = 14;
        ctx.fillStyle = C.surface;
        ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10); else ctx.rect(bx, by, bw, bh); ctx.fill();
        ctx.restore();
        Draw.text(ctx, T.mem.title, bx + 14, by + 18, { size: 13, color: C.ink, halo: false });
        const ox = bx + 14 + lab, rowY = [by + 36, by + 36 + gridH + 22];
        const tileAt = (n, row) => [ox + (Math.floor(n / BLOCK) % PER) * (tile + tg), rowY[row] + Math.floor(Math.floor(n / BLOCK) / PER) * (tile + tg)];
        const cellAt = (n, row) => { const [x, y] = tileAt(n, row), w = n % BLOCK; return [x + 2 + (w % 4) * (cell + 1), y + 2 + Math.floor(w / 4) * (cell + 1)]; };
        const showA = Math.min(1, Math.max(0, (k - 0.3) / 0.12)), moveT = Math.max(0, Math.min(1, (k - 0.5) / 0.4)), showB = Math.max(0, Math.min(1, (k - 0.9) / 0.08));
        const lit = row => new Set([...touched].map(i => Math.floor((row ? slotAfter[i] : i) / BLOCK)));
        function row(r, a, litA) {
          if (a <= 0) return;
          ctx.save();
          ctx.globalAlpha = a;
          Draw.text(ctx, r ? T.mem.after : T.mem.before, bx + 14, rowY[r] + gridH / 2 - 2, { size: 13, color: r ? C.query : C['ink-2'], halo: false });
          const L = lit(r);
          for (let t = 0; t < nb; t++) {
            const [x, y] = tileAt(t * BLOCK, r), on = L.has(t) && litA > 0;
            ctx.fillStyle = on ? Draw.alpha(C.query, 0.14 * litA) : Draw.alpha(C.ink, 0.04);
            ctx.fillRect(x, y, tile, tile);
            if (on) { ctx.strokeStyle = Draw.alpha(C.query, litA); ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.75, y + 0.75, tile - 1.5, tile - 1.5); }
          }
          if (litA > 0) {
            ctx.globalAlpha = a * litA;
            Draw.text(ctx, String(L.size), ox + gridW + 12, rowY[r] + gridH / 2 - 2, { size: 26, color: r ? C.query : C.ink, halo: false });
            Draw.text(ctx, T.mem.blocks, ox + gridW + 12 + (L.size > 9 ? 34 : 20), rowY[r] + gridH / 2 + 2, { size: 13, weight: 400, color: C['ink-2'], halo: false });
          }
          ctx.restore();
        }
        row(0, showA, showA);
        row(1, Math.min(1, moveT * 3), showB);
        // The cells: in insertion order on the first row; they fly to cluster order on the second.
        const sm = t => t * t * (3 - 2 * t);
        for (let i = 0; i < g.size; i++) {
          const fill = touched.has(i) ? C.query : blend(C.surface, CLUSTER[label[i]], 0.25 + 0.75 * cK);
          const a = cellAt(i, 0);
          if (showA > 0) { ctx.globalAlpha = showA * (moveT > 0 ? 0.55 : 1); ctx.fillStyle = fill; ctx.fillRect(a[0], a[1], cell, cell); }
          if (moveT > 0) {
            const t = sm(Math.max(0, Math.min(1, (moveT - slotAfter[i] / g.size * 0.5) / 0.5))), b2 = cellAt(slotAfter[i], 1);
            ctx.globalAlpha = 1; ctx.fillStyle = fill;
            ctx.fillRect(a[0] + (b2[0] - a[0]) * t, a[1] + (b2[1] - a[1]) * t, cell, cell);
          }
        }
        ctx.globalAlpha = 1;
        return showB > 0 ? lit(1).size : lit(0).size;
      }

      // ---- drawing: each helper takes a map M (the canvas view or a close-up),
      // a near(p) filter and z, the mark scale ----
      const ZR = 0.17;
      function links(M, gr, near, withShortcuts, z) {
        const { ctx } = cv;
        ctx.save();
        ctx.strokeStyle = Draw.alpha(C.ink, z > 1 ? 0.2 : 0.09); ctx.lineWidth = z;
        ctx.beginPath();
        gr.links.forEach((ls, u) => {
          for (const v of ls[0]) {
            if ((withShortcuts && isShort(u, v)) || (v < u && gr.links[v][0].includes(u))) continue;
            if (!near(gr.pts[u]) && !near(gr.pts[v])) continue;
            ctx.moveTo(M.x(gr.pts[u]), M.y(gr.pts[u])); ctx.lineTo(M.x(gr.pts[v]), M.y(gr.pts[v]));
          }
        });
        ctx.stroke();
        ctx.restore();
      }
      function labels() {
        const { ctx } = cv, lx = 0.02;
        Draw.text(ctx, T.bandData, V.x([lx, 0]), V.y([0, band(lx, LO) - 0.075]), { size: 13, color: C['ink-3'] });
        Draw.text(ctx, T.bandData, V.x([lx, 0]), V.y([0, band(lx, HI) + 0.075]), { size: 13, color: C['ink-3'] });
        Draw.text(ctx, T.bandQuery, V.x([lx, 0]), V.y([0, 0.5 + 0.05 * Math.sin(lx * 4 + 3)]), { size: 13, color: C.query });
      }
      function trainDots(M, near, z) {
        if (on) for (const tq of train.slice(0, nTrain)) if (near(tq)) Draw.ring(cv.ctx, M, tq, { r: 2.6 * z, color: Draw.alpha(C.query, 0.4), width: 1.2 });
      }
      function arcs(M, near, list, color, width, alpha, dash) {
        if (!list.length || alpha <= 0) return;
        const { ctx } = cv;
        ctx.save();
        ctx.strokeStyle = Draw.alpha(color, alpha); ctx.lineWidth = width;
        if (dash) ctx.setLineDash(dash);
        ctx.beginPath();
        for (const [a, b] of list) {
          const A = g.pts[a], B = g.pts[b];
          if (!near(A) && !near(B)) continue;
          const mx = (M.x(A) + M.x(B)) / 2, my = (M.y(A) + M.y(B)) / 2;
          ctx.moveTo(M.x(A), M.y(A));
          ctx.quadraticCurveTo(mx - (M.y(B) - M.y(A)) * 0.15, my + (M.x(B) - M.x(A)) * 0.15, M.x(B), M.y(B));
        }
        ctx.stroke();
        ctx.restore();
      }
      // The walk up to event p; rings for found (blue) and missed (red, dashed) neighbours once done.
      function walk(M, near, W, p, { training = false, rings = 1, z = 1 } = {}) {
        const { ctx } = cv, gr = W.gr;
        for (let i = 0; i < p; i++) {
          const a = gr.pts[W.events[i].from], b = gr.pts[W.events[i].id];
          if (near(a) || near(b)) Draw.segment(ctx, M, a, b, { color: Draw.alpha(C.query, 0.2), width: z });
        }
        const seen = new Set(W.events.slice(0, p).map(e => e.id));
        for (let i = 0; i < gr.size; i++) {
          if (!near(gr.pts[i])) continue;
          Draw.dot(ctx, M, gr.pts[i], seen.has(i) ? { r: 3.2 * z, fill: Draw.alpha(C.query, 0.55) } : { r: 2.8 * z, fill: Draw.alpha(C.point, 0.75) });
        }
        const path = W.path.filter((id, j) => W.reveal[j] < p);
        Draw.walk(ctx, M, path.map(id => gr.pts[id]), { nodes: false, width: 2.5 * Math.sqrt(z) });
        for (let i = 1; i < path.length; i++) {
          if (on && !training && isShort(path[i - 1], path[i])) Draw.walk(ctx, M, [gr.pts[path[i - 1]], gr.pts[path[i]]], { color: C.shortcut, width: 3.5 * Math.sqrt(z), nodes: false });
        }
        for (const id of path) if (near(gr.pts[id])) Draw.dot(ctx, M, gr.pts[id], { r: 3.8 * z, fill: C.query, ring: 1.75 });
        const done = p >= W.events.length;
        if (done && rings > 0) {
          for (const id of W.truth) {
            if (!near(gr.pts[id])) continue;
            if (W.ids.includes(id)) Draw.ring(ctx, M, gr.pts[id], { r: 7.5 * z, color: Draw.alpha(C.query, rings), width: 2 });
            else Draw.ring(ctx, M, gr.pts[id], { r: 7.5 * z, color: Draw.alpha(C.broken, rings), width: 2, dash: [3, 3] });
          }
        } else if (path.length && !done) Draw.ring(ctx, M, gr.pts[path[path.length - 1]], { r: 11 * z, color: Draw.alpha(C.query, 0.4), width: 2 });
        if (z === 1) {
          const e = gr.pts[gr.entry];
          Draw.text(ctx, T.start, M.x(e), M.y(e) - 16, { align: 'center', size: 14, color: C.ink });
        }
        if (training) {
          Draw.ring(ctx, M, W.q, { r: 7 * z, color: C.query, width: 2.5 });
          if (z === 1) Draw.text(ctx, T.trainOne, M.x(W.q), M.y(W.q) + 24, { align: 'center', size: 14, color: C.query });
        } else {
          Draw.query(ctx, M, W.q, { r: 6.5 * Math.sqrt(z) });
          if (z === 1) Draw.text(ctx, T.query, M.x(W.q), M.y(W.q) + 26, { align: 'center', size: 14, color: C.query });
        }
        return done;
      }
      const prog = (W, k) => Math.round(k * W.events.length);
      // The training query's found x missed pairs: the candidates step one makes.
      const demoPairs = () => {
        const out = [];
        for (const f of demo.ids) for (const m of demo.truth) if (!demo.ids.includes(m) && f !== m) out.push([f, m]);
        return out;
      };

      function render(i, kRaw) {
        frame = { i, k: kRaw };
        const [k, zk] = App.split(kRaw, segs()[i].main);
        const { ctx } = cv;
        ctx.clearRect(0, 0, cv.w, cv.h);
        const sub = T.sub;
        if (on && i === 0) {
          labels();
          const n = layoutStep(k);
          App.caption(ui.subtitle, k < 0.35 ? sub.layout1(KM) : sub.layout2(blocksBefore, n));
          testMetric(false);
          return;
        }
        if (on) i -= 1;   // the shortcut steps, numbered as before
        // Everything one step draws, through any map: the canvas, then the close-up.
        const paint = (M, near, z) => {
          if (!on) { links(M, g, near, false, z); return walk(M, near, test0, prog(test0, k), { z }); }
          if (i === 0) { links(M, g, near, false, z); trainDots(M, near, z); return walk(M, near, demo, prog(demo, k), { training: true, z }); }
          if (i === 1 || i === 2) {
            links(M, g, near, false, z);
            trainDots(M, near, z);
            if (i === 1) {
              arcs(M, near, demoPairs(), C.amber, 1.25 * z, Math.min(1, k / 0.35) * 0.9, [5 * z, 4 * z]);
              arcs(M, near, cand, C.amber, z, Math.max(0, (k - 0.35) / 0.65) * 0.14);
            } else {
              arcs(M, near, cand, C.amber, z, (1 - k) * 0.14);
              arcs(M, near, shortcuts, C.shortcut, 1.75 * z, k * 0.9);
            }
            walk(M, near, demo, demo.events.length, { training: true, rings: i === 1 ? 1 : 1 - k, z });
            return true;
          }
          links(M, h, near, true, z);
          trainDots(M, near, z);
          arcs(M, near, shortcuts, C.shortcut, 1.5 * z, 0.75);
          return walk(M, near, test0, prog(test0, k), { z });
        };
        labels();
        const done = paint(V, () => true, 1);
        // The close-up follows the query being searched, once its step has finished.
        const W = !on || i === 3 ? test0 : demo;
        const zt = !on ? T.zoom.off : T.zoom[i];
        if (zk > 0 && zt && App.zoomOn) {
          Draw.magnifier(ctx, V, { center: W.q, radius: ZR, box: Draw.quietCorner(V, cv.w, cv.h, g.pts, W.q, ZR, [360, 300]), grow: zk,
                                   title: zt[0], sub: zt[1], draw: (M, near) => paint(M, near, 1.5) });
        }
        if (!on) {
          App.caption(ui.subtitle, !done ? sub.walking : test0.found < K ? sub.off(test0.found, K) : sub.offOk(test0.found, K));
          return testMetric(done);
        }
        if (i === 0) {
          const miss = demo.truth.filter(id => !demo.ids.includes(id)).length;
          App.caption(ui.subtitle, done ? sub.mine1(demo.found, miss) : sub.walking);
        } else if (i === 1 || i === 2) {
          App.caption(ui.subtitle, i === 1 ? sub.mine2(cand.length, nTrain) : sub.mine3(cand.length, shortcuts.length));
        } else {
          App.caption(ui.subtitle, done ? sub.on(test0.found, K, test0.used) : sub.walking);
          return testMetric(done);
        }
        testMetric(false);
      }
      function testMetric(done) {
        const qEl = ui.q('#sc-q');
        if (done) App.count(qEl, test0.found, { unit: `<small>/ ${K}</small>` });
        else { qEl.innerHTML = '–'; delete qEl.dataset.v; }
        ui.q('#sc-q-note').textContent = done ? T.thisNote(new Set(test0.events.map(x => x.id)).size + 1) : '';
      }

      // ---- player ----
      const segs = () => (on
        ? [{ dur: 7000, hold: 6500, main: 1 }].concat([{ dur: Math.max(4500, demo.events.length * 230) }, { dur: 5500 }, { dur: 5000 }, { dur: Math.max(4500, test0.events.length * 230) }].map(sg => ({ ...App.withZoom(sg), hold: 6500 })))
        : [{ ...App.withZoom({ dur: Math.max(4500, test0.events.length * 230) }), hold: 6500 }]);
      let player;
      const syncTransport = App.bindTransport(ui.transport, () => player);
      function onChange(st) {
        syncTransport(st);
        const L = T.legend, P = ['k-point', L.point], found = [['k-walk', L.walk], ['k-found', L.found], ['k-missed', L.missed]];
        App.setLegend(ui, !on ? [P, ...found]
          : [[['k-cluster', L.cluster], ['k-touched', L.touched], ['k-block', L.block]],
             [P, ['k-train', L.train], ...found], [P, ['k-train', L.train], ['k-amber-dash', L.cand]], [P, ['k-amber', L.cand], ['k-short', L.short]], [P, ['k-short', L.short], ...found]][st.i]);
        ui.q('#sc-steps').querySelectorAll('li').forEach((li, j) => {
          const done = on && (j < st.i || (j === st.i && st.k >= 1 && !st.playing && j === 4));
          li.classList.toggle('active', on && j === st.i && !done);
          li.classList.toggle('done', done);
          li.querySelector('.n').textContent = done ? '✓' : j + 1;
        });
      }
      function panel() {
        App.count(ui.q('#sc-rec'), 100 * (on ? onRec : offRec), { digits: 1, unit: '<small>%</small>' });
        ui.q('#sc-rec-note').textContent = T.recallNote((100 * (on ? onId : offId)).toFixed(1) + ' %');
        ui.q('#sc-count').textContent = on ? T.count(shortcuts.length) : '';
        ui.q('#sc-mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.mode === 'on') === on)));
        const slider = ui.q('#sc-train');

        ui.q('#sc-train-v').textContent = nTrain;
      }

        if (seg == null) player.playAll(); else player.goto(seg);
      }

      mine();
      // Open on the test query the shortcuts help most, preferring one whose walk
      // actually crosses the strip on a shortcut.
      let best = -Infinity;
      for (const tq of test) {
        const tr = g.bruteForce(tq, K);
        const f0 = g.search(tq, K, EF).ids.filter(id => tr.includes(id)).length;
        const r1 = h.search(tq, K, EF, { trace: true });
        const f1 = r1.ids.filter(id => tr.includes(id)).length;
        const score = (crosses(r1.trace.path) ? 1000 : 0) + (f1 - f0) * 10 - f0;
        if (score > best) { best = score; q = tq; }
      }
      computeTest();
      computeTouched();
      player = App.player({ segments: segs(), render, onChange });
      restart();

      // ---- interaction ----
      let drag = false;
      const moveTo = ev => {
        const [x, y] = Draw.pointer(ui.canvas, ev);
        const d = V.inv(x, y);
        q = [Math.max(0, Math.min(aspect, d[0])), Math.max(0, Math.min(1, d[1]))];
        computeTest();
        computeTouched();
        player.setSegments(segs());
        player.show(segs().length - 1, 1);
      };
      ui.canvas.style.cursor = 'crosshair';
      ui.canvas.addEventListener('pointerdown', ev => { drag = true; ui.canvas.setPointerCapture(ev.pointerId); moveTo(ev); });
      ui.canvas.addEventListener('pointermove', ev => { if (drag) moveTo(ev); });
      const release = () => { if (!drag) return; drag = false; player.goto(segs().length - 1); };
      ui.canvas.addEventListener('pointerup', release);
      ui.canvas.addEventListener('pointercancel', release);
      ui.q('#sc-mode').addEventListener('click', ev => {
        const b = ev.target.closest('button');

        computeTest();
        restart();
      });
      ui.q('#sc-steps').addEventListener('click', ev => {
        const li = ev.target.closest('li[data-seg]');
        if (!li) return;
        if (!on) { on = true; computeTest(); }
        restart(+li.dataset.seg);
      });
      ui.q('#sc-train').addEventListener('input', ev => {
        ev.target.style.setProperty('--fill', ((ev.target.value - 25) / (NTRAIN - 25) * 100) + '%');
        ui.q('#sc-train-v').textContent = ev.target.value;
      });
      ui.q('#sc-train').addEventListener('change', ev => {
        nTrain = +ev.target.value;
        mine();
        computeTest();
        panel();
        player.setSegments(segs());
        player.show(segs().length - 1, 1);
      });

      return {
        resize() { cv = Draw.setup(ui.canvas, App.pixelZoom()); V = Draw.view(cv.w, cv.h, aspect, PAD); render(frame.i, frame.k); },
        unmount() { player.stop(); },
      };
    },
  });
})();

// Which measured datasets the demo shows. Each technique is judged on its own
// thesis metric only (Ch.3 build time, Ch.5 recall-matched QPS, Ch.4 the graph
// after an update; CLAUDE.md: never mix them), and a dataset is shown only when
// every one of them is a clear win: shortcuts and both at least +10 % QPS at
// recall 99 %, density-adaptive build at least 5 % faster, and Update Repair
// with fewer unreachable points, higher recall and less upkeep than a rebuild.
// The full results stay in results.json; both measured scenes use this list.
window.Measured = (function () {
  'use strict';
  const R = window.RESULTS, KH = R.knowhere, UR = KH.update_repair;
  const KX = R.knowhere_extra || { datasets: {}, runs: {} };
  const BASE = ['LAION', 'COCO', 'ImageNet', 'T2I', 'SIFT'];
  const EXTRA = Object.keys(KX.datasets);
  const pick = (block, field, d) => {
    const src = EXTRA.includes(d) ? (KX[block] || {})[field] : KH[block][field];
    return src && src[d] != null ? src[d] : null;
  };
  const urPick = (field, s, d) => {
    const src = (EXTRA.includes(d) ? (KX.update_repair || {})[field] : UR[field]) || {};
    return src[s] && src[s][d] != null ? src[s][d] : null;
  };
  const win = d => {
    if (EXTRA.includes(d) && !['w4_A', 'w4_B', 'w5_D', 'w6_replace'].every(k => (KX.runs[d] || {})[k] >= 3)) return false;
    const qs = pick('query_shortcuts_vs_knowhere', 'qps_at_recall99_pct', d);
    const dab = pick('density_adaptive_build_vs_knowhere', 'build_pct', d);
    const both = pick('both_vs_knowhere', 'qps_at_recall99_pct', d);
    const u = (f, s) => urPick(f, s, d);
    return qs != null && qs >= 10 && dab != null && dab <= -5 && both != null && both >= 10
      && u('unreachable_nodes', 'update_repair') != null && u('unreachable_nodes', 'update_repair') < u('unreachable_nodes', 'update_only')
      && u('recall10_at_ef128_pct', 'update_repair') > u('recall10_at_ef128_pct', 'update_only')
      && u('upkeep_s', 'update_repair') < u('upkeep_s', 'rebuild');
  };
  return { list: BASE.concat(EXTRA).filter(win), extra: EXTRA, pick, urPick, KX };
})();
