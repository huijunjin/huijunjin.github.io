<!doctype html>
<html lang="ko" class="app-root">
<head>
<meta charset="utf-8">
<title>Unified-HNSW Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Design tokens and shared components for the lab demo (light theme only:
   the defence room projector washes out dark backgrounds). Colour roles were
   checked with the dataviz palette validator: a scene uses at most three of the
   accent roles at once (query/repair/broken in Update Repair, query/shortcut in
   Query Shortcuts), and charts pair the baseline grey with one accent. */
:root {
  color-scheme: light;
  --bg: #f3f2ee;
  --surface: #fcfcfb;
  --surface-2: #f6f5f1;
  --ink: #141413;
  --ink-2: #52514e;
  --ink-3: #8a8983;
  --line: #e6e4de;
  --axis: #c3c2b7;

  --query: #2a78d6;      /* the question and the search walk */
  --repair: #1baf7a;     /* Update Repair (PRO-HNSW) */
  --shortcut: #eb6834;   /* Query Shortcuts (CAMP-HNSW) */
  --density: #6250d6;    /* Density-Adaptive Build (DHNSW) */
  --broken: #d03b3b;     /* status: cut link, unreachable point */
  --amber: #e29a00;      /* step highlight: what a step clears or proposes */
  --magenta: #d55181;    /* step highlight: reverse links (RUE) */
  --base: #a8a69e;       /* baseline series: Milvus HNSW, vanilla */
  --point: #4a4945;
  --edge: rgba(20, 20, 19, 0.13);

  --font: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ease: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --r: 16px;
  --r-sm: 10px;
  --shadow: 0 1px 2px rgba(20, 20, 19, 0.04), 0 12px 32px -16px rgba(20, 20, 19, 0.14);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
}

/* ---- type ---- */
.kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.title { font-size: 40px; font-weight: 700; line-height: 1.25; letter-spacing: -0.025em; margin: 0; }
.lead { font-size: 18px; color: var(--ink-2); line-height: 1.65; margin: 0; }
.caption { font-size: 13px; color: var(--ink-3); }
.hero { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }

/* ---- chips & badges ---- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 13px; color: var(--ink-2); font-weight: 700;
}
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.tag {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; color: var(--ink-2);
}
.tag i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* ---- buttons ---- */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font: 700 15px/1 var(--font); padding: 12px 18px;
  border-radius: var(--r-sm); cursor: pointer;
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease);
}
.btn:hover { border-color: var(--axis); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn[disabled] { opacity: 0.4; cursor: default; }

.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); }
.seg button { appearance: none; border: 0; background: transparent; font: 700 14px/1 var(--font); color: var(--ink-2); padding: 9px 14px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 20, 19, 0.1); }

/* ---- switch ---- */
.switch { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.switch input { appearance: none; width: 40px; height: 24px; border-radius: 12px; background: var(--axis); position: relative; margin: 0; cursor: pointer; transition: background 0.25s var(--ease); }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 0.25s var(--ease); }
.switch input:checked { background: var(--ink); }
.switch input:checked::after { transform: translateX(16px); }

/* ---- slider ---- */
.field { display: grid; gap: 8px; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--ink-2); }
.field-head b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--ink) var(--fill, 50%), var(--line) var(--fill, 50%)); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--ink); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); margin-top: -8px; }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }

/* ---- metric tile ---- */
.metric { display: grid; gap: 6px; }
.metric .label { font-size: 14px; color: var(--ink-2); }
.metric .value { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.metric .value small { font-size: 0.45em; font-weight: 700; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.metric.sm .value { font-size: 32px; }
.metric .note { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.metric .note i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ---- step list ---- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; padding: 9px 12px; border-radius: var(--r-sm); color: var(--ink-3); transition: background 0.3s var(--ease), color 0.3s var(--ease); }
.steps li .n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--axis); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.steps li b { color: inherit; font-size: 15px; letter-spacing: 0.02em; margin-right: 8px; }
.steps li span { font-size: 15px; }
.steps li.done { color: var(--ink-2); }
.steps li.done .n { background: var(--repair); border-color: var(--repair); color: #fff; }
.steps li.active { background: var(--surface-2); color: var(--ink); }
.steps li.active .n { border-color: var(--ink); background: var(--ink); color: var(--surface); }

/* ---- scene shell ---- */
.app { width: 1600px; height: 900px; display: grid; grid-template-rows: 72px 1fr; background: var(--bg); }
.topbar { display: flex; align-items: center; gap: 36px; padding: 0 40px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand em { font-style: normal; font-weight: 400; color: var(--ink-3); }
.nav { display: flex; gap: 4px; }
.nav a { padding: 8px 14px; border-radius: 999px; font-size: 15px; color: var(--ink-2); text-decoration: none; white-space: nowrap; font-weight: 700; }
.nav a.on { background: var(--ink); color: var(--surface); }
.nav a.off { color: var(--axis); }
.topbar .spacer { flex: 1; }
.stage { display: grid; grid-template-columns: 1fr 440px; gap: 40px; padding: 4px 40px 36px; min-height: 0; }
.canvas-card { position: relative; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.canvas-card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.canvas-card .badge { position: absolute; top: 20px; left: 20px; }
.canvas-card .legend { position: absolute; left: 22px; bottom: 18px; display: flex; gap: 18px; }
.canvas-card .subtitle {
  position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
  background: rgba(20, 20, 19, 0.86); color: #fff; padding: 10px 18px; border-radius: 10px;
  font-size: 18px; white-space: nowrap;
}
.panel { display: flex; flex-direction: column; gap: 18px; padding-top: 8px; min-height: 0; }
.panel .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel .controls { display: grid; gap: 18px; }
.panel .row { display: flex; gap: 10px; align-items: center; }
.panel .metrics { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; padding-top: 20px; border-top: 1px solid var(--line); margin-top: auto; }

/* ---- app frame: the 1600x900 stage scaled to the window ---- */
html.app-root, html.app-root body { height: 100%; overflow: hidden; }
.viewport { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
.viewport .app { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.nav a { transition: background 0.25s var(--ease), color 0.25s var(--ease); }
.nav a[data-id]:hover:not(.on) { background: var(--surface-2); color: var(--ink); }
.stage.in { animation: scene-in 0.6s var(--ease-out); }
@keyframes scene-in { from { opacity: 0; transform: translateY(10px); } }
.still *, .still *::before, .still *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.panel .title { margin-top: 14px; text-wrap: balance; }
.panel .lead { margin-top: 14px; }
.canvas-card canvas { touch-action: none; }
.canvas-card .subtitle { transition: opacity 0.3s var(--ease); }
.btn:focus-visible, .seg button:focus-visible, .switch input:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--query); outline-offset: 2px; }
.hint { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-2); }
.hint::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--query); box-shadow: 0 0 0 5px rgba(42, 120, 214, 0.16); flex: none; }

/* ---- legend keys ---- */
.tag i.k-point { background: var(--point); }
.tag i.k-hub { background: var(--ink); width: 12px; height: 12px; }
.tag i.k-seen { background: rgba(42, 120, 214, 0.5); }
.tag i.k-walk, .tag i.k-repair, .tag i.k-short, .tag i.k-base { width: 18px; height: 3px; border-radius: 2px; }
.tag i.k-walk { background: var(--query); }
.tag i.k-repair { background: var(--repair); }
.tag i.k-short { background: var(--shortcut); }
.tag i.k-base { background: var(--base); }
.tag i.k-found { background: transparent; border: 1.75px solid var(--query); width: 12px; height: 12px; }
.tag i.k-hole { background: var(--surface); border: 1.5px solid var(--ink-3); }
.tag i.k-cut { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed var(--broken); }
.tag i.k-lost { width: 13px; height: 13px; background: radial-gradient(circle, var(--point) 0 2.5px, transparent 3px); border: 2px solid var(--broken); }
.tag i.k-back { width: 13px; height: 13px; background: radial-gradient(circle, var(--point) 0 2.5px, transparent 3px); border: 2px solid var(--repair); }
.tag i.k-del { background: var(--broken); width: 10px; height: 10px; }
.steps.compact { gap: 2px; }
.steps.compact li { padding: 5px 12px; }
.canvas-card .cnote { position: absolute; top: 18px; right: 22px; max-width: 460px; margin: 0; text-align: right; font-size: 13px; line-height: 1.55; color: var(--ink-3); }
.steps li.skip { color: var(--axis); }
.steps li.skip span { text-decoration: line-through; }
.steps li .tagline { margin-left: 8px; font-size: 12px; color: var(--ink-3); text-decoration: none; }
.panel .note-small { font-size: 13px; color: var(--ink-3); line-height: 1.55; margin: 0; }
.rounds { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-left: auto; }
.tag i.k-train { background: transparent; border: 1.5px solid rgba(42, 120, 214, 0.55); width: 8px; height: 8px; }
.tag i.k-missed { background: transparent; border: 1.75px dashed var(--broken); width: 12px; height: 12px; }

/* ---- measured-results charts (bars grow from one baseline; 24 px max) ---- */
.chart-host { position: absolute; inset: 0; padding: 70px 44px 26px; display: flex; flex-direction: column; gap: 18px; }
.chart-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.chart-head h3 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
.chart-head .sub { font-size: 14px; color: var(--ink-3); margin-top: 2px; }
.chart-head .ctrls { display: flex; gap: 10px; flex-wrap: wrap; }
.chart-legend { display: flex; gap: 20px; font-size: 14px; color: var(--ink-2); }
.chart-legend span { display: inline-flex; align-items: center; gap: 8px; }
.chart-legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.chart-body { flex: 1; display: flex; align-items: center; min-height: 0; }
.bars2 { width: 100%; display: grid; grid-template-columns: 150px 1fr; column-gap: 18px; row-gap: 22px; align-items: center; }
.b-lab { font-size: 15px; font-weight: 700; color: var(--ink-2); text-align: right; }
.b-group { display: grid; gap: 2px; }
.b-track { position: relative; height: 24px; }
.b-axis { position: absolute; top: -11px; bottom: -11px; width: 1px; background: var(--axis); }
.b-bar { position: absolute; top: 0; height: 24px; border-radius: 0 4px 4px 0; transform-origin: left center; transition: transform 0.7s var(--ease-out); cursor: default; }
.b-bar.neg { border-radius: 4px 0 0 4px; transform-origin: right center; }
.b-bar.pre { transform: scaleX(0); }
.b-val { position: absolute; top: 0; height: 24px; display: flex; align-items: center; font-size: 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); }
.b-na { position: absolute; top: 0; height: 24px; display: flex; align-items: center; font-size: 13px; color: var(--ink-3); }
.chart-foot { display: flex; justify-content: space-between; gap: 24px; font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.chart-foot b { color: var(--ink-2); white-space: nowrap; }
.chart-tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 13px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -130%); }
.views { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.views button { width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left; padding: 9px 12px; border: 0; border-radius: var(--r-sm); background: transparent; font: inherit; color: var(--ink-3); cursor: pointer; transition: background 0.25s var(--ease), color 0.25s var(--ease); }
.views button:hover { background: var(--surface-2); }
.views .n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--axis); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.views b { display: block; font-size: 16px; color: inherit; }
.views small { display: block; font-size: 13px; }
.views button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.views button[aria-pressed="true"] .n { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.metric .value.hero-sm { font-size: 48px; }

/* ---- step player ---- */
.transport { position: absolute; right: 20px; bottom: 12px; display: flex; align-items: center; gap: 6px; }
.transport button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; transition: border-color 0.2s var(--ease), background 0.2s var(--ease); }
.transport button:hover { border-color: var(--axis); }
.transport button.main { width: 44px; height: 44px; background: var(--ink); color: var(--surface); border-color: var(--ink); }
.transport button:focus-visible { outline: 2px solid var(--query); outline-offset: 2px; }
.steps li[data-seg] { cursor: pointer; }
.steps li[data-seg]:hover:not(.active) { background: var(--surface-2); color: var(--ink-2); }
.tag i.k-dense { background: var(--density); width: 12px; height: 12px; }
.tag i.k-sparse { background: rgba(98, 80, 214, 0.4); width: 7px; height: 7px; }
.tag i.k-heat { width: 30px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, rgba(226, 154, 0, 0.05), rgba(226, 154, 0, 0.6)); }
.tag i.k-link { width: 18px; height: 2px; border-radius: 1px; background: var(--axis); }
.bars2.dense { row-gap: 12px; }
.bars2.dense .b-track, .bars2.dense .b-bar, .bars2.dense .b-val, .bars2.dense .b-na { height: 15px; }
.bars2.dense .b-axis { top: -6px; bottom: -6px; }
.bars2.dense .b-val { font-size: 13px; }
.b-lab .b-new { display: block; font-size: 11px; font-weight: 700; color: var(--density); letter-spacing: 0.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: 700 14px/1 var(--font); padding: 8px 12px; border-radius: 999px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chips button:focus-visible { outline: 2px solid var(--query); outline-offset: 2px; }
.field-label { font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
.steps .mod { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-right: 8px; }
.steps .mod::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.steps .mod-0::before { background: var(--density); }
.steps .mod-1::before { background: var(--repair); }
.steps .mod-2::before { background: var(--shortcut); }
.steps .mod-3::before { background: var(--ink); }
.metric .label .tiny { font-size: 11px; color: var(--ink-3); margin-left: 6px; font-weight: 400; }
.metric .label .tiny.measured { color: var(--ink-2); font-weight: 700; }
.topbar .lang button { padding: 7px 12px; font-size: 13px; }
html[lang="en"] .panel .title { font-size: 34px; }
.mrange { display: flex; align-items: center; gap: 10px; margin-left: auto; padding: 4px 8px; border-radius: 8px; }
.mrange .mr-track { position: relative; width: 120px; height: 10px; border-radius: 5px; background: var(--line); }
.mrange .mr-seg { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--density); transition: left 0.6s var(--ease), width 0.6s var(--ease); }
.mrange .mr-fixed { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
.mrange b { font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mrange.flash { animation: flash 1.2s var(--ease-out); }
@keyframes flash { 0% { background: rgba(98, 80, 214, 0.22); } 100% { background: transparent; } }
.tag i.k-arrow { position: relative; width: 14px; height: 2px; border-radius: 0; background: var(--ink-2); margin-right: 4px; }
.tag i.k-arrow::after { content: ""; position: absolute; right: -5px; top: -3px; border-left: 6px solid var(--ink-2); border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.chart-body .cv { width: 100%; height: 100%; overflow: visible; }
.cv .cv-grid { stroke: var(--line); stroke-width: 1; }
.cv .cv-axis { stroke: var(--axis); stroke-width: 1; }
.cv .cv-guide { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 4 4; }
.cv .cv-tick { fill: var(--ink-3); font: 400 13px var(--font); }
.cv .cv-label { fill: var(--ink-2); font: 700 13px var(--font); }
.cv .cv-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 1.4s var(--ease-out); }
.cv .cv-line.pre { stroke-dashoffset: 1; }
.cv .cv-dot { stroke: var(--surface); stroke-width: 2; cursor: default; }
.cv .cv-dot:hover { stroke: var(--ink); }
.cv .cv-hit { fill: none; stroke-width: 2; }
.cv .cv-times { fill: var(--ink); font: 700 18px var(--font); }
/* The caption keeps to one line in the band above the legend; graphs leave that band free (PAD bottom 124). */
.canvas-card .subtitle { white-space: nowrap; width: max-content; max-width: calc(100% - 48px); overflow: hidden; text-overflow: ellipsis; text-align: center; font-size: 17px; padding: 9px 18px; bottom: 62px; }

/* ---- step colours: the active step's number takes the colour it paints on the canvas ---- */
.steps li.active .n { background: var(--step, var(--ink)); border-color: var(--step, var(--ink)); color: #fff; }
.steps li.done .n { background: var(--step, var(--repair)); border-color: var(--step, var(--repair)); color: #fff; opacity: 0.55; }
.tag i.k-amber { width: 18px; height: 3px; border-radius: 2px; background: var(--amber); }
.tag i.k-amber-dash { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed var(--amber); }
.tag i.k-new { background: var(--query); }
.tag i.k-magenta-arrow { position: relative; width: 14px; height: 2px; border-radius: 0; background: var(--magenta); margin-right: 4px; }
.tag i.k-magenta-arrow::after { content: ""; position: absolute; right: -5px; top: -3px; border-left: 6px solid var(--magenta); border-top: 4px solid transparent; border-bottom: 4px solid transparent; }

</script>
<script>
// A small 2-D HNSW for the demo scenes. Follows hnswlib and the unified fork
// (~/hnsw-unified/src/hnswlib/hnswalg.h): heuristic neighbour selection
// (getNeighborsByHeuristic2), M links per upper layer and 2M at layer 0,
// ef-bounded best-first search that walks through deleted points without
// returning them, slot reuse on insert (replace_deleted), and Chapter 4's
// repairs ROE, RDN and RUE. Every random draw comes from a seeded RNG so a scene
// renders the same way on every machine.
(function (root) {
  'use strict';

  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function gauss(r) {
    let u = 0;
    while (u === 0) u = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r());
  }

  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const byDist = (a, b) => a[0] - b[0];

  // Keep `arr` sorted ascending by [0]; arrays stay short (<= ef), so linear insert is fine.
  function insertSorted(arr, item) {
    let i = arr.length;
    while (i > 0 && arr[i - 1][0] > item[0]) i--;
    arr.splice(i, 0, item);
  }

  class HNSW {
    constructor({ M = 6, efConstruction = 48, seed = 1 } = {}) {
      this.M = M;
      this.M0 = 2 * M;
      this.efC = efConstruction;
      this.mL = 1 / Math.log(M);
      this.rand = rng(seed);
      this.pts = [];
      this.level = [];
      this.links = [];          // links[id][layer] = neighbour ids
      this.dead = [];           // marked deleted: still walked through, never returned
      this.vacant = [];         // deleted slots waiting for reuse, oldest first
      this.ndead = 0;
      this.entry = -1;
      this.maxLevel = -1;
      this.ndist = 0;           // distance computations, for step counts
    }

    get size() { return this.pts.length; }
    cap(layer) { return layer === 0 ? this.M0 : this.M; }

    d(q, id) { this.ndist++; return dist(q, this.pts[id]); }

    randomLevel() { return Math.floor(-Math.log(1 - this.rand()) * this.mL); }

    // A deep copy, so two update runs can start from the same graph.
    clone() {
      const g = Object.assign(Object.create(HNSW.prototype), this);
      g.pts = this.pts.slice();
      g.level = this.level.slice();
      g.dead = this.dead.slice();
      g.vacant = this.vacant.slice();
      g.links = this.links.map(ls => ls.map(l => l.slice()));
      g.rand = rng(this.size * 7919 + 17);
      return g;
    }

    // Greedy descent on an upper layer (hnswlib's searchKnn / addPoint loop).
    greedy(q, ep, layer, tr) {
      let cur = ep, cd = this.d(q, ep), changed = true;
      while (changed) {
        changed = false;
        for (const n of this.links[cur][layer]) {
          const dn = this.d(q, n);
          if (tr) {
            tr.evaluated.push({ layer, id: n, from: cur });
            if (!tr.parent.has(n)) tr.parent.set(n, cur);
          }
          if (dn < cd) { cd = dn; cur = n; changed = true; }
        }
      }
      return cur;
    }

    // Best-first search on one layer (searchBaseLayer / searchBaseLayerST).
    // Deleted points are expanded but never enter the result list, and with
    // deletions present the search keeps going until it holds ef live results.
    searchLayer(q, eps, ef, layer, tr) {
      const seen = new Set(eps);
      const cand = [], res = [];
      for (const e of eps) {
        const de = this.d(q, e);
        insertSorted(cand, [de, e]);
        if (!this.dead[e]) insertSorted(res, [de, e]);
      }
      while (res.length > ef) res.pop();
      while (cand.length) {
        const [dc, c] = cand.shift();
        const worst = res.length ? res[res.length - 1][0] : Infinity;
        if (dc > worst && (res.length >= ef || !this.ndead)) break;
        if (tr) tr.expanded.push({ layer, id: c });
        for (const n of this.links[c][layer]) {
          if (seen.has(n)) continue;
          seen.add(n);
          const dn = this.d(q, n);
          if (tr) {
            tr.evaluated.push({ layer, id: n, from: c });
            if (!tr.parent.has(n)) tr.parent.set(n, c);
          }
          if (res.length < ef || dn < res[res.length - 1][0]) {
            insertSorted(cand, [dn, n]);
            if (!this.dead[n]) {
              insertSorted(res, [dn, n]);
              if (res.length > ef) res.pop();
            }
          }
        }
      }
      return res;
    }

    // getNeighborsByHeuristic2: keep a candidate only if it is closer to the
    // base than to every neighbour already kept. W is sorted by distance.
    selectNeighbors(W, M) {
      const out = [];
      for (const [dc, c] of W) {
        if (out.length >= M) break;
        let good = true;
        for (const r of out) {
          if (dist(this.pts[c], this.pts[r]) < dc) { good = false; break; }
        }
        if (good) out.push(c);
      }
      return out;
    }

    // Candidates sorted by distance to point `base`.
    ranked(base, ids) { return ids.map(x => [dist(base, this.pts[x]), x]).sort(byDist); }

    // mutuallyConnectNewElement: M links out of `id`, then a link back from each,
    // re-pruning a full list with the heuristic. A DHNSW budget {M, M0} replaces
    // both: the new point picks its own M, and the neighbour lists it joins are
    // capped at that M above layer 0 and at the constant M0 = 2*m_start on it.
    connect(id, W, layer, isUpdate, budget) {
      const pick = budget ? budget.M : this.M;
      const cap = budget ? (layer ? budget.M : budget.M0) : this.cap(layer);
      const nb = this.selectNeighbors(W, pick);
      this.links[id][layer] = nb.slice();
      for (const n of nb) {
        const ln = this.links[n][layer];
        if (isUpdate && ln.includes(id)) continue;
        if (ln.length < cap) { ln.push(id); continue; }
        this.links[n][layer] = this.selectNeighbors(this.ranked(this.pts[n], ln.concat(id)), cap);
      }
      return nb[0];
    }

    // `budget` is DHNSW's per-point {M, ef, M0} (addPoint's M_node / ef_node /
    // M0_node); without it the insertion is upstream's.
    add(p, forcedLevel, budget) {
      const id = this.pts.length;
      const L = forcedLevel != null ? forcedLevel : this.randomLevel();
      this.pts.push(p);
      this.level.push(L);
      this.dead.push(0);
      this.links.push(Array.from({ length: L + 1 }, () => []));
      if (this.entry < 0) { this.entry = id; this.maxLevel = L; return id; }

      let ep = this.entry;
      for (let l = this.maxLevel; l > L; l--) ep = this.greedy(p, ep, l);
      for (let l = Math.min(L, this.maxLevel); l >= 0; l--) {
        const W = this.searchLayer(p, [ep], budget ? budget.ef : this.efC, l);
        if (W.length) ep = this.connect(id, W, l, false, budget);
      }
      if (L > this.maxLevel) { this.maxLevel = L; this.entry = id; }
      return id;
    }

    markDelete(id) {
      if (this.dead[id]) return;
      this.dead[id] = 1;
      this.ndead++;
      this.vacant.push(id);
    }

    // addPoint(replace_deleted=true): reuse the oldest vacant slot. updatePoint
    // re-picks the links of the slot's old neighbours from their 1- and 2-hop
    // candidates (which include the slot, now holding the new vector), then
    // repairConnectionsForUpdate links the slot in from the entry point.
    // Links that other points held into the slot are left as they were.
    replace(p) {
      if (!this.vacant.length) return this.add(p);
      const id = this.vacant.shift();
      this.dead[id] = 0;
      this.ndead--;
      this.pts[id] = p;
      for (let l = 0; l <= this.level[id]; l++) {
        const one = this.links[id][l];
        if (!one.length) continue;
        const cand = new Set([id]);
        for (const a of one) {
          cand.add(a);
          for (const b of this.links[a][l]) cand.add(b);
        }
        for (const nb of one) {
          const C = this.ranked(this.pts[nb], [...cand].filter(c => c !== nb)).slice(0, this.efC);
          this.links[nb][l] = this.selectNeighbors(C, this.cap(l));
        }
      }
      let cur = this.entry;
      for (let l = this.maxLevel; l > this.level[id]; l--) cur = this.greedy(p, cur, l);
      for (let l = this.level[id]; l >= 0; l--) {
        const W = this.searchLayer(p, [cur], this.efC, l).filter(x => x[1] !== id);
        if (W.length) cur = this.connect(id, W, l, true);
      }
      return id;
    }

    // ROE (removeObsoleteEdges): live points drop their links into `ids`, unless
    // a list would be left with no live neighbour at all. Returns [from, to, layer].
    removeObsoleteEdges(ids) {
      const del = new Set(ids), removed = [];
      for (let u = 0; u < this.size; u++) {
        if (this.dead[u]) continue;
        for (let l = 0; l <= this.level[u]; l++) {
          const L = this.links[u][l];
          const keep = L.filter(v => !del.has(v));
          if (!L.length || keep.length < 1) continue;
          for (const v of L) if (del.has(v)) removed.push([u, v, l]);
          this.links[u][l] = keep;
        }
      }
      return removed;
    }

    // Directed BFS components over all layers, started from each unvisited live
    // point in id order (findAllComponents).
    components() {
      const seen = new Uint8Array(this.size), comps = [];
      for (let s = 0; s < this.size; s++) {
        if (this.dead[s] || seen[s]) continue;
        const comp = [s], queue = [s];
        seen[s] = 1;
        while (queue.length) {
          const v = queue.shift();
          for (let l = 0; l <= this.level[v]; l++)
            for (const u of this.links[v][l])
              if (!this.dead[u] && !seen[u]) { seen[u] = 1; comp.push(u); queue.push(u); }
        }
        comps.push(comp);
      }
      return comps;
    }

    // RDN (repairDisconnectedNodes): every point in a component smaller than half
    // the live graph asks nearby points for incoming links, on each of its layers.
    // Returns the links added as [from, to, layer].
    repairDisconnectedNodes() {
      const live = this.size - this.ndead, added = [];
      for (const comp of this.components()) {
        if (comp.length >= live / 2) continue;
        for (const v of comp)
          for (let l = 0; l <= this.level[v]; l++) this.fillIncoming(v, l, added);
      }
      return added;
    }

    // attemptLimitedHopRepairFillM: BFS out along v's own links; each point met
    // that has a free slot links to v. At least three hops, then stop on the first
    // hop that gained a link, or once v counts cap(layer) links.
    fillIncoming(v, l, added) {
      const cap = this.cap(l);
      let deg = this.links[v][l].length;
      if (deg >= cap) return;
      const seen = new Uint8Array(this.size);
      seen[v] = 1;
      let frontier = [v], hop = 0;
      while (frontier.length && deg < cap) {
        hop++;
        let gained = false;
        const next = [];
        for (const u of frontier) {
          if (deg >= cap) break;
          for (const c of this.links[u][l]) {
            if (deg >= cap) break;
            if (c === v || seen[c] || this.dead[c]) continue;
            seen[c] = 1;
            next.push(c);
            const L = this.links[c][l];
            if (L.includes(v)) { gained = true; deg++; continue; }
            if (L.length < cap) { L.push(v); added.push([c, v, l]); gained = true; deg++; }
          }
        }
        if (hop >= 3 && gained) break;
        frontier = next;
      }
    }

    // RUE (resolveEdgeAsymmetry): on layer 0, give each one-way link u -> v its
    // reverse v -> u (addIncomingEdgeIfPossible). Returns the links added.
    resolveEdgeAsymmetry() {
      const added = [];
      for (let u = 0; u < this.size; u++) {
        if (this.dead[u]) continue;
        for (const v of this.links[u][0].slice()) {
          if (this.dead[v] || this.links[v][0].includes(u)) continue;
          const L = this.links[v][0];
          if (L.length < this.M0) { L.push(u); added.push([v, u, 0]); continue; }
          const sel = this.selectNeighbors(this.ranked(this.pts[v], L.concat(u)), this.M0);
          this.links[v][0] = sel;
          if (sel.includes(u)) added.push([v, u, 0]);
        }
      }
      return added;
    }

    // Live points a search can reach from the entry point, through any layer.
    reachable() {
      const seen = new Uint8Array(this.size), stack = [this.entry];
      seen[this.entry] = 1;
      while (stack.length) {
        const v = stack.pop();
        for (let l = 0; l <= this.level[v]; l++)
          for (const u of this.links[v][l]) if (!seen[u]) { seen[u] = 1; stack.push(u); }
      }
      for (let i = 0; i < this.size; i++) if (this.dead[i]) seen[i] = 0;
      return seen;
    }

    // k nearest by graph search. With `trace`, also returns what was expanded and
    // the chain of links from the entry point to the best result.
    search(q, k, ef, { trace = false } = {}) {
      const tr = trace ? { expanded: [], evaluated: [], parent: new Map([[this.entry, -1]]) } : null;
      const before = this.ndist;
      let ep = this.entry;
      for (let l = this.maxLevel; l > 0; l--) ep = this.greedy(q, ep, l, tr);
      const W = this.searchLayer(q, [ep], Math.max(ef, k), 0, tr);
      const ids = W.slice(0, k).map(x => x[1]);
      const out = { ids, ndist: this.ndist - before };
      if (tr) {
        const path = [];
        for (let v = ids[0]; v !== -1 && v !== undefined; v = tr.parent.get(v)) path.push(v);
        tr.path = path.reverse();
        out.trace = tr;
      }
      return out;
    }

    // CAMP-HNSW's mining (ours_backend.cpp mine_and_filter_cpp): for each
    // training query, pair every retrieved point with every true neighbour the
    // search missed, both ways; then each point keeps at most `budget` of its
    // candidates (the closest 2*budget, filtered by the RNG heuristic).
    // Returns [src, dst] pairs.
    mineShortcuts(queries, k, ef, budget, detail) {
      const cand = new Map();
      const push = (a, b) => { if (!cand.has(a)) cand.set(a, new Set()); cand.get(a).add(b); };
      for (const q of queries) {
        const found = this.search(q, k, ef).ids;
        const got = new Set(found);
        const missing = this.bruteForce(q, k).filter(id => !got.has(id));
        for (const h of found) for (const m of missing) if (h !== m) { push(h, m); push(m, h); }
      }
      if (detail) {   // every candidate link before filtering, once per unordered pair
        detail.cand = [];
        for (const [i, set] of cand) for (const j of set) if (i < j) detail.cand.push([i, j]);
      }
      const pairs = [];
      for (const [i, set] of cand) {
        const C = this.ranked(this.pts[i], [...set]).slice(0, 2 * budget);
        for (const t of this.selectNeighbors(C, budget)) pairs.push([i, t]);
      }
      return pairs;
    }

    // injectShortcuts (hnswalg.h): on every layer both ends share, add dst to
    // src's list and let it compete with the existing links under the RNG
    // heuristic (joint competitive pruning). Returns the pairs that survived on
    // layer 0.
    injectShortcuts(pairs) {
      const kept = [];
      for (const [src, dst] of pairs) {
        const common = Math.min(this.level[src], this.level[dst]);
        for (let l = 0; l <= common; l++) {
          const L = this.links[src][l];
          if (L.includes(dst)) continue;
          this.links[src][l] = this.selectNeighbors(this.ranked(this.pts[src], L.concat(dst)), this.cap(l));
          if (l === 0 && this.links[src][0].includes(dst)) kept.push([src, dst]);
        }
      }
      return kept;
    }

    bruteForce(q, k) {
      const out = [];
      for (let i = 0; i < this.size; i++) if (!this.dead[i]) out.push([dist(q, this.pts[i]), i]);
      return out.sort(byDist).slice(0, k).map(x => x[1]);
    }

    recall(queries, k, ef) {
      let hit = 0;
      for (const q of queries) {
        const truth = new Set(this.bruteForce(q, k));
        for (const id of this.search(q, k, ef).ids) if (truth.has(id)) hit++;
      }
      return hit / (queries.length * k);
    }
  }

  // DHNSW's parameter adaptation (unified/density.py). density: mean distance to
  // the k nearest neighbours (large = sparse; the paper first projects to dim/3,
  // which a 2-D demo skips). budgets: the coefficient of variation times lambda
  // opens [m_start, m_end] and [ef_start, ef_end] around the vanilla values, and
  // each point sits in that range by its min-max position, sparse points high.
  function densities(pts, k = 16) {
    return pts.map(p => {
      const d = pts.map(q => dist(p, q)).sort((a, b) => a - b).slice(1, k + 1);
      return d.reduce((a, b) => a + b, 0) / d.length;
    });
  }
  // `paperDirection` follows the paper's text (denser point -> larger M and ef);
  // without it the code's behaviour (larger mean distance -> larger M) is kept.
  function budgets(dens, { mVanilla, efVanilla, lambda = 1.5, paperDirection = false }) {
    const mean = dens.reduce((a, b) => a + b, 0) / dens.length;
    const cv = Math.sqrt(dens.reduce((a, b) => a + (b - mean) ** 2, 0) / dens.length) / mean;
    const delta = cv * lambda;
    const mStart = Math.max(2, Math.trunc(mVanilla - mVanilla * delta)), mEnd = Math.trunc(mVanilla + mVanilla * delta);
    const efStart = Math.max(10, Math.trunc(efVanilla - efVanilla * delta)), efEnd = Math.trunc(efVanilla + efVanilla * delta);
    const lo = Math.min(...dens), hi = Math.max(...dens), span = hi - lo;
    const per = dens.map(d => {
      const f0 = span ? (d - lo) / span : 0, f = paperDirection ? 1 - f0 : f0;
      return { M: Math.trunc(Math.min(mEnd, Math.max(mStart, mStart + f * (mEnd - mStart)))),
               ef: Math.trunc(Math.min(efEnd, Math.max(efStart, efStart + f * (efEnd - efStart)))),
               M0: 2 * mStart };
    });
    return { cv, delta, mStart, mEnd, efStart, efEnd, per };
  }

  // Blue-noise samples from a density: dart throwing with a minimum spacing,
  // so points never pile on each other at demo zoom levels.
  function sample(r, n, draw, minGap, maxTries = 60) {
    const pts = [];
    const cell = minGap / Math.SQRT2;
    const grid = new Map();
    const key = (x, y) => Math.floor(x / cell) + ',' + Math.floor(y / cell);
    for (let t = 0; pts.length < n && t < n * maxTries; t++) {
      const p = draw(r);
      if (!p) continue;
      const gx = Math.floor(p[0] / cell), gy = Math.floor(p[1] / cell);
      let ok = true;
      for (let dx = -2; dx <= 2 && ok; dx++)
        for (let dy = -2; dy <= 2 && ok; dy++) {
          const q = grid.get((gx + dx) + ',' + (gy + dy));
          if (q && dist(p, q) < minGap) ok = false;
        }
      if (!ok) continue;
      grid.set(key(p[0], p[1]), p);
      pts.push(p);
    }
    return pts;
  }

  // Clustered density over [0, aspect] x [0, 1]: k Gaussian blobs plus a uniform share.
  function mixture(r, aspect, k, spread, uniform) {
    const cs = Array.from({ length: k }, () => [0.12 + r() * (aspect - 0.24), 0.14 + r() * 0.72, spread[0] + r() * spread[1]]);
    return rr => {
      if (rr() < uniform) return [0.03 + rr() * (aspect - 0.06), 0.04 + rr() * 0.92];
      const c = cs[Math.floor(rr() * cs.length)];
      const p = [c[0] + gauss(rr) * c[2], c[1] + gauss(rr) * c[2]];
      return p[0] > 0.03 && p[0] < aspect - 0.03 && p[1] > 0.04 && p[1] < 0.96 ? p : null;
    };
  }

  function shuffle(r, a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  root.HN = { rng, gauss, dist, HNSW, sample, mixture, shuffle, densities, budgets };
})(window);
</script>
<script>
// Canvas helpers shared by every scene: HiDPI setup, a domain-to-pixel view,
// and the few marks the demo draws (links, points, walks, the query, shortcuts).
// Colours come from the CSS tokens in theme.css so the canvas and the page agree.
(function (root) {
  'use strict';

  const C = {};
  function tokens() {
    const s = getComputedStyle(document.documentElement);
    for (const k of ['surface', 'ink', 'ink-2', 'ink-3', 'line', 'axis', 'query', 'repair',
                     'shortcut', 'density', 'broken', 'base', 'point', 'edge', 'font', 'amber', 'magenta']) {
      C[k] = s.getPropertyValue('--' + k).trim();
    }
    return C;
  }

  // Sizes from layout (clientWidth), not getBoundingClientRect, so a canvas inside
  // a CSS-scaled preview still renders at full resolution.
  function setup(canvas, zoom = 1) {
    const dpr = Math.max(1, root.devicePixelRatio || 1) * zoom;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    return { ctx, w, h };
  }

  // Domain [0, aspect] x [0, 1] -> pixels, centred inside the padding.
  function view(w, h, aspect, pad) {
    const iw = w - pad[1] - pad[3], ih = h - pad[0] - pad[2];
    const s = Math.min(iw / aspect, ih);
    const ox = pad[3] + (iw - s * aspect) / 2, oy = pad[0] + (ih - s) / 2;
    return { s, x: p => ox + p[0] * s, y: p => oy + p[1] * s, inv: (x, y) => [(x - ox) / s, (y - oy) / s] };
  }

  // Pointer position in the canvas's layout pixels, whatever CSS scale the stage has.
  function pointer(canvas, e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * canvas.clientWidth / r.width, (e.clientY - r.top) * canvas.clientHeight / r.height];
  }

  function alpha(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }

  function links(ctx, V, g, { layer = 0, color = C.edge, width = 1, only = null, dash = null } = {}) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    for (let i = 0; i < g.size; i++) {
      const L = g.links[i][layer];
      if (!L) continue;
      for (const j of L) {
        if (only && !only(i, j)) continue;
        if (j < i && g.links[j][layer] && g.links[j][layer].includes(i) && !only) continue; // draw mutual links once
        ctx.moveTo(V.x(g.pts[i]), V.y(g.pts[i]));
        ctx.lineTo(V.x(g.pts[j]), V.y(g.pts[j]));
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  function segment(ctx, V, a, b, { color, width = 1.5, dash = null }) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.moveTo(V.x(a), V.y(a));
    ctx.lineTo(V.x(b), V.y(b));
    ctx.stroke();
    ctx.restore();
  }

  // Filled dot with a surface-coloured ring so it stays legible on top of links.
  function dot(ctx, V, p, { r = 2.6, fill = C.point, ring = 0, ringColor = C.surface } = {}) {
    const x = V.x(p), y = V.y(p);
    if (ring) {
      ctx.beginPath(); ctx.arc(x, y, r + ring, 0, Math.PI * 2);
      ctx.fillStyle = ringColor; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }

  function ring(ctx, V, p, { r = 7, color = C.query, width = 1.75, dash = null } = {}) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.arc(V.x(p), V.y(p), r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // Hollow marker for a deleted slot.
  function hole(ctx, V, p, { r = 3.2, color = C['ink-3'] } = {}) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 1.25;
    ctx.fillStyle = C.surface;
    ctx.beginPath(); ctx.arc(V.x(p), V.y(p), r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // A walk through the graph: a surface underlay then the coloured line, so the
  // walk reads above the links it follows.
  function walk(ctx, V, pts, { color = C.query, width = 2.5, dash = null, nodes = true } = {}) {
    if (pts.length < 2) return;
    ctx.save();
    for (const [c, w] of [[C.surface, width + 3], [color, width]]) {
      ctx.strokeStyle = c; ctx.lineWidth = w;
      if (dash && c === color) ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.moveTo(V.x(pts[0]), V.y(pts[0]));
      for (let i = 1; i < pts.length; i++) ctx.lineTo(V.x(pts[i]), V.y(pts[i]));
      ctx.stroke();
    }
    ctx.restore();
    if (nodes) for (const p of pts) dot(ctx, V, p, { r: 3.6, fill: color, ring: 1.75 });
  }

  // Curved jump for a shortcut link, with an arrowhead at the target.
  function jump(ctx, V, a, b, { color = C.shortcut, width = 2.25, bend = 0.25, head = 8, dash = null } = {}) {
    const x0 = V.x(a), y0 = V.y(a), x1 = V.x(b), y1 = V.y(b);
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    const nx = -(y1 - y0), ny = x1 - x0;
    const cx = mx + nx * bend, cy = my + ny * bend;
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
    ctx.setLineDash([]);
    const ang = Math.atan2(y1 - cy, x1 - cx);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - head * Math.cos(ang - 0.42), y1 - head * Math.sin(ang - 0.42));
    ctx.lineTo(x1 - head * Math.cos(ang + 0.42), y1 - head * Math.sin(ang + 0.42));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // The query: solid core, surface ring, soft halo.
  function query(ctx, V, q, { color = C.query, r = 6.5 } = {}) {
    const x = V.x(q), y = V.y(q);
    ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2);
    ctx.fillStyle = alpha(color, 0.1); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r + 2.5, 0, Math.PI * 2);
    ctx.fillStyle = C.surface; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
  }

  function text(ctx, str, x, y, { size = 13, weight = 700, color = C['ink-2'], align = 'left', base = 'middle', halo = true } = {}) {
    ctx.save();
    ctx.font = `${weight} ${size}px ${C.font}`;
    ctx.textAlign = align; ctx.textBaseline = base;
    if (halo) { ctx.lineWidth = 4; ctx.strokeStyle = C.surface; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color; ctx.fillText(str, x, y);
    ctx.restore();
  }

  // A close-up: a ring on the main view marks where it looks, two lines lead to
  // a box that redraws that spot larger. draw(M, near) paints the box with M as
  // its domain-to-pixel map; near(p) says whether a point falls inside it.
  // `grow` (0..1) plays it in: the ring first, then the box opening out of it.
  function magnifier(ctx, V, { center, radius, box, title, sub, draw, alpha: a = 1, grow = 1 }) {
    if (grow <= 0) return;
    const cx = V.x(center), cy = V.y(center), rr = radius * V.s;
    const ringK = Math.min(1, grow / 0.25), t = easeInOut(Math.max(0, (grow - 0.25) / 0.75));
    if (t <= 0) {
      ctx.save();
      ctx.globalAlpha = a * ringK;
      ctx.fillStyle = alpha(C.ink, 0.04); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.75;
      ctx.beginPath(); ctx.arc(cx, cy, rr * (1.6 - 0.6 * ringK), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
      return;
    }
    const mix = (u, v) => u + (v - u) * t;
    const bx = mix(cx - rr, box[0]), by = mix(cy - rr, box[1]), bw = mix(2 * rr, box[2]), bh = mix(2 * rr, box[3]);
    const head = (sub ? 46 : 30) * t;
    const sc = (Math.min(bw, bh - head) / 2 - 10) / radius;
    const M = { s: V.s * sc / V.s, x: p => bx + bw / 2 + (p[0] - center[0]) * sc, y: p => by + head + (bh - head) / 2 + (p[1] - center[1]) * sc };
    const near = p => Math.abs(p[0] - center[0]) < (bw / 2 - 6) / sc && Math.abs(p[1] - center[1]) < ((bh - head) / 2 - 6) / sc;
    ctx.save();
    ctx.globalAlpha = a;
    // connector lines from the ring to the two nearer corners of the box
    const corners = [[bx, by], [bx + bw, by], [bx, by + bh], [bx + bw, by + bh]]
      .sort((a, b) => Math.hypot(a[0] - cx, a[1] - cy) - Math.hypot(b[0] - cx, b[1] - cy)).slice(0, 2);
    ctx.strokeStyle = alpha(C.ink, 0.35); ctx.lineWidth = 1;
    for (const [x, y] of corners) {
      const d = Math.hypot(x - cx, y - cy) || 1;
      ctx.beginPath(); ctx.moveTo(cx + (x - cx) / d * rr, cy + (y - cy) / d * rr); ctx.lineTo(x, y); ctx.stroke();
    }
    ctx.fillStyle = alpha(C.ink, 0.04); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.75;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.shadowColor = 'rgba(20, 20, 19, 0.18)'; ctx.shadowBlur = 18;
    ctx.fillStyle = C.surface;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 12); else ctx.rect(bx, by, bw, bh);
    ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.rect(bx, by + head - 4, bw, bh - head + 4); ctx.clip();
    draw(M, near);
    ctx.restore();
    if (t >= 1) {
      text(ctx, title, bx + 14, by + 18, { size: 13, color: C.ink, halo: false });
      if (sub) text(ctx, sub, bx + 14, by + 36, { size: 12, color: C['ink-2'], weight: 400, halo: false });
    }
    ctx.restore();
  }
  const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // Where to put a close-up box: of the four corners (clear of the badge, the
  // caption band, legend and controls), the one that covers the fewest points
  // and not the spot itself.
  function quietCorner(V, w, h, pts, center, radius, [bw, bh]) {
    const cx = V.x(center), cy = V.y(center), rr = radius * V.s + 12;
    const boxes = [[w - bw - 24, 84], [24, 84], [24, h - bh - 116], [w - bw - 24, h - bh - 116]];
    let best = null, fewest = Infinity;
    for (const [x, y] of boxes) {
      if (cx + rr > x && cx - rr < x + bw && cy + rr > y && cy - rr < y + bh) continue;
      let n = 0;
      for (const p of pts) { const px = V.x(p), py = V.y(p); if (px > x && px < x + bw && py > y && py < y + bh) n++; }
      if (n < fewest) { fewest = n; best = [x, y, bw, bh]; }
    }
    return best || [w - bw - 24, h - bh - 116, bw, bh];
  }

  root.Draw = { C, tokens, setup, view, pointer, alpha, magnifier, quietCorner, links, segment, dot, ring, hole, walk, jump, query, text };
})(window);
</script>
<script>
// App shell: fits the 1600x900 stage to the window, routes between scenes by
// location.hash (#intro, #repair, ...), and gives scenes a shared layout,
// count-up numbers and an animation clock.
// Query parameters pin a state for screenshots: ?scene= ?step= ?seed= ?still= ?lang=.
// claude.ai artifacts drop the query string, so these only matter locally.
(function (root) {
  'use strict';
  const params = new URLSearchParams(location.search);
  // Language: ?lang=, else the viewer's last choice, else Korean. root.STR is the
  // current copy; scenes read it on mount, so a switch remounts the scene.
  const LANGS = { ko: '한국어', en: 'English' };
  const KEY = 'delab-demo-lang';
  const stored = (() => { try { return localStorage.getItem(KEY); } catch (e) { return null; } })();
  let lang = LANGS[params.get('lang')] ? params.get('lang') : LANGS[stored] ? stored : 'ko';
  let S = root.STR = root.STRINGS[lang];
  const ORDER = ['intro', 'density', 'repair', 'shortcut', 'versus', 'perf'];
  const defs = {};
  const reduced = !!(root.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let current = null, currentId = null, scale = 1, app, stage, nav;

  const App = {
    params,
    seed: +(params.get('seed') || 1),
    // Jump every animation to its last (or ?step=) frame: captures and reduced motion.
    still: params.has('still') || params.has('step') || reduced,
    step: params.has('step') ? +params.get('step') : null,
    get scale() { return scale; },
    get lang() { return lang; },
    // Close-ups on or off, remembered per browser like the language.
    zoomOn: (() => { try { return localStorage.getItem('delab-demo-zoom') !== 'off'; } catch (e) { return true; } })(),
    toggleZoom() {
      App.zoomOn = !App.zoomOn;
      try { localStorage.setItem('delab-demo-zoom', App.zoomOn ? 'on' : 'off'); } catch (e) { /* keep for this visit */ }
      if (current && current.resize) current.resize();
    },
    register(id, def) { defs[id] = def; },
  };

  // Shared scene layout: canvas card on the left, text, controls and numbers on the right.
  App.layout = function (el, o) {
    el.innerHTML = `
      <div class="canvas-card">
        ${o.chart ? '<div class="chart-host"></div>' : '<canvas></canvas>'}
        <span class="badge">${o.badge || S.principle}</span>
        ${o.note ? `<p class="cnote">${o.note}</p>` : ''}
        <div class="subtitle" hidden></div>
        <div class="legend">${(o.legend || []).map(([k, label]) => `<span class="tag"><i class="${k}"></i>${label}</span>`).join('')}</div>
        ${o.transport ? transportHTML(o.zoom) : ''}
      </div>
      ${o.cite ? `<p class="cite">${o.cite}</p>` : ''}
      <aside class="panel">
        <div>
          <div class="meta"><span class="kicker">${o.kicker}</span><span class="caption">${o.meta}</span></div>
          <h1 class="title">${o.title}</h1>
          <p class="lead">${o.lead}</p>
        </div>
        ${o.body || ''}
        <div class="metrics">${o.metrics || ''}</div>
      </aside>`;
    return { canvas: el.querySelector('canvas'), chart: el.querySelector('.chart-host'), card: el.querySelector('.canvas-card'),
             subtitle: el.querySelector('.subtitle'), transport: el.querySelector('.transport'), q: s => el.querySelector(s) };
  };

  const ICON = {
    loop: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V8a3 3 0 0 1 3-3h8l-2.2-2.2M16 11v1a3 3 0 0 1-3 3H5l2.2 2.2"/><text x="10" y="12.3" font-size="6.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">1</text></svg>',
    zoom: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5"/><path d="M12.3 12.3l4.2 4.2M6.5 8.5h4M8.5 6.5v4"/></svg>',
    restart: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10a5.5 5.5 0 1 0 1.8-4.1"/><path d="M4 3.5v3.6h3.6"/></svg>',
    prev: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l-5 5 5 5"/></svg>',
    next: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg>',
    play: '<svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor"><path d="M7 4.5l9 5.5-9 5.5z"/></svg>',
    pause: '<svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor"><rect x="5.5" y="4.5" width="3" height="11" rx="1"/><rect x="11.5" y="4.5" width="3" height="11" rx="1"/></svg>',
  };
  function transportHTML(zoom) {
    const t = S.transport;
    return `<div class="transport">
      ${zoom ? `<button data-a="zoom" class="zoom" title="${t.zoom}" aria-label="${t.zoom}" aria-pressed="${App.zoomOn}">${ICON.zoom}</button>` : ''}
      <button data-a="loop" class="loop" title="${t.loop}" aria-label="${t.loop}" aria-pressed="false">${ICON.loop}</button>
      <button data-a="restart" title="${t.restart}" aria-label="${t.restart}">${ICON.restart}</button>
      <button data-a="prev" title="${t.prev}" aria-label="${t.prev}">${ICON.prev}</button>
      <button data-a="toggle" class="main" title="${t.play}" aria-label="${t.play}">${ICON.play}</button>
      <button data-a="next" title="${t.next}" aria-label="${t.next}">${ICON.next}</button>
    </div>`;
  }

  // Plays a scene as a list of segments. Each segment animates k from 0 to 1 over
  // its own duration; playAll() runs them in order with a pause between, goto(i)
  // plays segment i alone and stops, toggle() pauses and resumes, show(i, k)
  // draws one frame. render(i, k) draws; onChange(state) updates the panel.
  // Steps run at this fraction of their nominal length.
  App.pace = 0.85;
  // A step that ends on a close-up gives its first `main` share of k to the step's
  // own animation and the rest to the close-up playing in, so the two never overlap.
  App.ZOOM_IN = 1600;   // ms the close-up takes to play in
  App.split = (k, main = 1) => (main >= 1 ? [k, k >= 1 ? 1 : 0] : [Math.min(1, k / main), Math.max(0, (k - main) / (1 - main))]);
  App.withZoom = sg => ({ ...sg, dur: sg.dur + App.ZOOM_IN, main: sg.dur / (sg.dur + App.ZOOM_IN) });

  App.player = function ({ segments, render, onChange, hold = 3500 }) {
    let i = 0, k = 0, playing = false, all = false, halt = null, loop = false;
    const emit = () => onChange && onChange({ i, k, playing, all, n: segments.length });
    const stop = () => { if (halt) halt(); halt = null; };
    function run() {
      stop();
      playing = true;
      emit();
      let k0 = k, base = 0, holdAt = null;
      halt = App.animate(t => {
        if (holdAt === null) {
          k = Math.min(1, k0 + (t - base) / (segments[i].dur * App.pace));
          render(i, k);
          if (k < 1) return true;
          if (!loop && (!all || i === segments.length - 1)) { playing = false; emit(); return false; }
          holdAt = t;
          return true;
        }
        if (t - holdAt < (segments[i].hold != null ? segments[i].hold : hold) * (loop ? 0.6 : App.pace)) return true;
        if (!loop) i++;   // repeat-one plays the same step again
        k = 0; k0 = 0; base = t; holdAt = null;
        emit();
        render(i, 0);
        return true;
      });
    }
    const P = {
      get i() { return i; }, get k() { return k; }, get playing() { return playing; },
      setSegments(s) { segments = s; i = Math.min(i, s.length - 1); },
      playAll() { if (App.still) return P.show(segments.length - 1, 1); i = 0; k = 0; all = true; run(); },
      goto(j) { i = Math.max(0, Math.min(segments.length - 1, j)); k = 0; all = false; if (App.still) return P.show(i, 1); run(); },
      playFrom(j) { i = Math.max(0, Math.min(segments.length - 1, j)); k = 0; all = true; if (App.still) return P.show(segments.length - 1, 1); run(); },
      toggle() {
        if (playing) { stop(); playing = false; emit(); return; }
        if (k >= 1 && i === segments.length - 1) return P.playAll();
        if (k >= 1) { i++; k = 0; }
        run();
      },
      prev() { P.goto(i - 1); },
      next() { P.goto(i + 1); },
      show(j, kk = 1) { stop(); playing = false; i = j; k = kk; render(i, k); emit(); },
      stop() { stop(); playing = false; },
      get loop() { return loop; },
      toggleLoop() { loop = !loop; if (loop && !playing) P.goto(i); else emit(); return loop; },
    };
    return P;
  };

  // Wires the canvas-corner buttons to a player and keeps the play/pause icon right.
  // `ref` is the player, or a function returning it (the player is often made after this).
  App.bindTransport = function (el, ref) {
    if (!el) return () => {};
    const P = () => (typeof ref === 'function' ? ref() : ref);
    el.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.a === 'loop') { b.setAttribute('aria-pressed', String(P().toggleLoop())); return; }
      if (b.dataset.a === 'zoom') { App.toggleZoom(); b.setAttribute('aria-pressed', String(App.zoomOn)); return; }
      const p = P();
      ({ restart: p.playAll, prev: p.prev, toggle: p.toggle, next: p.next })[b.dataset.a]();
    });
    const main = el.querySelector('[data-a="toggle"]');
    return st => {
      main.innerHTML = st.playing ? ICON.pause : ICON.play;
      const label = st.playing ? S.transport.pause : S.transport.play;
      main.title = label; main.setAttribute('aria-label', label);
    };
  };

  // Replace a scene's legend, e.g. when a mode switch changes what the canvas draws.
  App.setLegend = function (ui, items) {
    ui.card.querySelector('.legend').innerHTML = items.map(([k, label]) => `<span class="tag"><i class="${k}"></i>${label}</span>`).join('');
  };

  App.cite = key => `<b>${S.citeLabel}</b>${S.cite[key]}`;

  App.caption = function (el, text) {
    if (!text) { el.hidden = true; return; }
    if (el.dataset.text === text && !el.hidden) return;
    el.dataset.text = text;
    el.innerHTML = text;
    el.hidden = false;
  };

  // Numbers roll to their new value (600 ms, ease-out) unless the scene is pinned.
  App.count = function (el, to, { digits = 0, unit = '' } = {}) {
    const from = el.dataset.v === undefined ? to : +el.dataset.v;
    el.dataset.v = to;
    const fmt = v => v.toLocaleString('ko-KR', { minimumFractionDigits: digits, maximumFractionDigits: digits }) + unit;
    cancelAnimationFrame(+el.dataset.raf || 0);
    if (App.still || from === to) { el.innerHTML = fmt(to); return; }
    const t0 = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - t0) / 600), e = 1 - Math.pow(1 - k, 3);
      el.innerHTML = fmt(from + (to - from) * e);
      if (k < 1) el.dataset.raf = requestAnimationFrame(tick);
    };
    el.dataset.raf = requestAnimationFrame(tick);
  };

  // Calls fn(elapsed ms) every frame until it returns false; returns a stop function.
  App.animate = function (fn) {
    let id = 0, t0 = null, on = true;
    const tick = now => {
      if (!on) return;
      if (t0 === null) t0 = now;
      if (fn(now - t0) === false) { on = false; return; }
      id = requestAnimationFrame(tick);
    };
    id = requestAnimationFrame(tick);
    return () => { on = false; cancelAnimationFrame(id); };
  };

  App.pixelZoom = () => Math.max(1, scale);

  function fit() {
    const vw = root.innerWidth, vh = root.innerHeight;
    scale = Math.min(vw / 1600, vh / 900);
    app.style.transform = `translate(${(vw - 1600 * scale) / 2}px, ${(vh - 900 * scale) / 2}px) scale(${scale})`;
    if (current && current.resize) current.resize();
  }

  // Each research keeps its colour everywhere; the tabs show it as a dot.
  const DOT = { density: 'density', repair: 'repair', shortcut: 'shortcut', versus: 'query' };
  function renderNav() {
    nav.innerHTML = ORDER.map(id => defs[id]
      ? `<a href="#${id}" data-id="${id}">${DOT[id] ? `<i class="navdot" style="background: var(--${DOT[id]})"></i>` : ''}${S.nav[id]}</a>`
      : `<a class="off" title="${S.soon}">${S.nav[id]}</a>`).join('');
  }

  function show(id) {
    if (!defs[id]) id = 'intro';
    if (id === currentId) return;
    if (current && current.unmount) current.unmount();
    stage.classList.remove('in');
    void stage.offsetWidth;
    stage.innerHTML = '';
    currentId = id;
    for (const a of nav.querySelectorAll('a[data-id]')) a.classList.toggle('on', a.dataset.id === id);
    const t0 = performance.now();
    current = defs[id].mount(stage) || {};
    if (params.has('timing')) {   // how long the scene's own computation takes, for slow laptops
      const tag = document.getElementById('timing') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'timing' }));
      tag.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:99;font:12px monospace;background:#fff;padding:4px 8px';
      tag.textContent = `${id} mount ${Math.round(performance.now() - t0)} ms`;
    }
    stage.classList.add('in');
  }

  function step(dir) {
    const ready = ORDER.filter(id => defs[id]);
    const i = ready.indexOf(currentId);
    const next = ready[Math.max(0, Math.min(ready.length - 1, i + dir))];
    if (next !== currentId) location.hash = next;
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = S.pageTitle;
    document.getElementById('brand-name').textContent = S.brand;
    document.getElementById('brand-lab').textContent = S.lab;
    document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
    renderNav();
  }

  function setLang(l) {
    if (!LANGS[l] || l === lang) return;
    lang = l;
    S = root.STR = root.STRINGS[l];
    try { localStorage.setItem(KEY, l); } catch (e) { /* private window: keep it for this visit */ }
    applyLang();
    const id = currentId;
    currentId = null;
    show(id);
  }

  function start() {
    app = document.getElementById('app');
    stage = document.getElementById('stage');
    nav = document.getElementById('nav');
    const box = document.getElementById('lang');
    box.innerHTML = Object.entries(LANGS).map(([l, name]) => `<button data-l="${l}" lang="${l}">${name}</button>`).join('');
    box.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setLang(b.dataset.l); });
    if (App.still) document.documentElement.classList.add('still');
    applyLang();
    fit();
    addEventListener('resize', fit);
    addEventListener('hashchange', () => show(location.hash.slice(1)));
    addEventListener('keydown', e => {
      if (e.target.closest('input, button, select')) return;
      if (e.key === 'ArrowRight') step(1);
      if (e.key === 'ArrowLeft') step(-1);
    });
    show(params.get('scene') || location.hash.slice(1) || 'intro');
  }

  // ?debug prints script errors on the page, for headless screenshots.
  if (params.has('debug')) {
    addEventListener('error', e => {
      const d = document.createElement('pre');
      d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;margin:0;padding:8px;background:#fff;color:#d03b3b;font:12px monospace;white-space:pre-wrap';
      d.textContent = `${e.message}\n${e.filename}:${e.lineno}:${e.colno}`;
      document.body.appendChild(d);
    });
  }

  // Start at once; redraw canvas text when the web font arrives.
  addEventListener('DOMContentLoaded', () => {
    start();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => current && current.resize && current.resize());
  });

  root.App = App;
})(window);
</script>
<script>
// Intro: what makes HNSW hierarchical. The layers are drawn as stacked, tilted
// planes. First the graph is built point by point, each point reaching up to a
// random top layer; then one search jumps across the sparse upper layers,
// drops one layer at a time and looks around the bottom layer; last the planes
// fold onto one another into the flat 2-D view the other scenes use. Click or
// drag on the canvas to move the query; the search replays on release.
(function () {
  'use strict';
  let T;   // the current language's copy, read on mount
  const N = 300, M = 4, EFC = 40, K = 10, EF = 12, TOP = 2;   // layers 0..TOP, so three planes fit the canvas
  const PAD = [76, 44, 124, 44];   // the bottom band stays free for the caption
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const lerp = (a, b, t) => a + (b - a) * t;
  const W_EVAL = 1, W_DROP = 3;   // weights of an upper-layer comparison and of a drop, for the step's timing

  App.register('intro', {
    mount(stage) {
      T = STR.intro;
      const ui = App.layout(stage, {
        kicker: T.kicker, meta: T.meta, title: T.title, lead: T.lead, transport: true, cite: App.cite('hnsw'),
        legend: [],
        body: `<ol class="steps" id="intro-steps">${T.steps.map(([b, s], i) =>
                 `<li data-seg="${i}" style="--step: var(--${['ink-2', 'amber', 'query', 'ink'][i]})"><span class="n">${i + 1}</span><div><b>${b}</b><span>${typeof s === 'function' ? s(K) : s}</span></div></li>`).join('')}</ol>
               <div class="controls"><div class="hint">${T.hint}</div></div>`,
        metrics: `<div class="metric"><div class="label">${T.compared}</div><div class="value" id="intro-n"></div><div class="note" id="intro-n-note"></div></div>
                  <div class="metric sm"><div class="label">${T.match}</div><div class="value" id="intro-k"></div><div class="note">${T.matchNote(K)}</div></div>`,
      });
      const C = Draw.tokens();
      let cv = Draw.setup(ui.canvas, App.pixelZoom());
      const aspect = (cv.w - PAD[1] - PAD[3]) / (cv.h - PAD[0] - PAD[2]);
      let V = Draw.view(cv.w, cv.h, aspect, PAD);

      // The graph, with a copy of every link list after each insertion so the
      // build can be replayed as it happened.
      const r = HN.rng(App.seed * 7919);
      const g = new HN.HNSW({ M, efConstruction: EFC, seed: App.seed });
      const snaps = [];
      HN.sample(r, N, HN.mixture(r, aspect, 9, [0.04, 0.06], 0.35), 0.016 * Math.sqrt(900 / N)).forEach(p => {
        g.add(p, Math.min(TOP, g.randomLevel()));
        snaps.push(g.links.map(ls => ls.map(l => l.slice())));
      });
      const top = g.maxLevel;
      ui.q('#intro-n-note').textContent = T.comparedNote(g.size);

      // Plane geometry: layer `top` at the top of the canvas, layer 0 at the bottom.
      let G;
      function geometry() {
        const left = 150, right = 40, W = cv.w - left - right, H = cv.h - PAD[0] - PAD[2];
        const sh = 0.2 * W, ph = H / (top + 1 + top * 0.4);
        G = { left, sh, pw: W - sh, ph, y0: l => PAD[0] + (top - l) * ph * 1.4 };
      }
      geometry();
      // Domain -> pixels on layer l's plane, folded toward the flat view by t.
      function mapOf(l, t) {
        const y0 = G.y0(l);
        const lx = p => G.left + (p[0] / aspect) * G.pw + (1 - p[1]) * G.sh, ly = p => y0 + p[1] * G.ph;
        if (!t) return { s: G.pw / aspect, x: lx, y: ly };
        return { s: lerp(G.pw / aspect, V.s, t), x: p => lerp(lx(p), V.x(p), t), y: p => lerp(ly(p), V.y(p), t) };
      }

      // ---- the search, layer by layer ----
      let q, up, upW, ep0, ev0, path0, reveal0, run, matches, frame = { i: 3, k: 1 }, qScreen = [0, 0];
      function compute() {
        // Upper layers: hnswlib's greedy descent, each comparison and each move kept.
        up = []; upW = 0;
        let cur = g.entry;
        const push = e => { e.w0 = upW; upW += e.w; up.push(e); };
        for (let l = top; l > 0; l--) {
          let cd = HN.dist(q, g.pts[cur]), changed = true;
          while (changed) {
            changed = false;
            const from = cur;
            for (const n of g.links[from][l]) {
              const dn = HN.dist(q, g.pts[n]), move = dn < cd;
              push({ l, from, id: n, move, w: W_EVAL });
              if (move) { cd = dn; cur = n; changed = true; }
            }
          }
          push({ l, drop: cur, w: W_DROP });
        }
        ep0 = cur;
        // Layer 0: the library's own search, which starts from the same point.
        run = g.search(q, K, EF, { trace: true });
        ev0 = run.trace.evaluated.filter(e => e.layer === 0);
        const parent = new Map([[ep0, -1]]);
        ev0.forEach(e => { if (!parent.has(e.id)) parent.set(e.id, e.from); });
        path0 = [];
        for (let v = run.ids[0]; v !== -1 && v !== undefined; v = parent.get(v)) path0.push(v);
        path0.reverse();
        const first = new Map();
        ev0.forEach((e, j) => { if (!first.has(e.id)) first.set(e.id, j); });
        reveal0 = path0.map(id => (id === ep0 ? -1 : first.get(id)));
        const truth = new Set(g.bruteForce(q, K));
        matches = run.ids.filter(id => truth.has(id)).length;
      }
      const segments = () => [
        { dur: 8000 },
        { dur: Math.max(4500, upW * 260) },
        { dur: Math.min(12000, Math.max(4500, ev0.length * 170)) },
        { dur: 3600, hold: 5000 },
      ];

      // ---- drawing ----
      function plane(ctx, Mp, l, a, c) {
        const m = 0.035, cs = [[-m, -m], [aspect + m, -m], [aspect + m, 1 + m], [-m, 1 + m]];
        ctx.save();
        ctx.beginPath();
        cs.forEach((p, j) => (j ? ctx.lineTo(Mp.x(p), Mp.y(p)) : ctx.moveTo(Mp.x(p), Mp.y(p))));
        ctx.closePath();
        ctx.globalAlpha = 0.8 * a; ctx.fillStyle = C.surface; ctx.fill();
        ctx.globalAlpha = a; ctx.fillStyle = Draw.alpha(C.ink, 0.03); ctx.fill();
        ctx.strokeStyle = Draw.alpha(C.ink, 0.16); ctx.lineWidth = 1; ctx.stroke();
        let n = 0;
        for (let u = 0; u < c; u++) if (g.level[u] >= l) n++;
        const lx = Mp.x([-m, 0.5]) - 16, ly = Mp.y([-m, 0.5]);
        ctx.globalAlpha = a * a;   // labels leave first, before the planes meet
        Draw.text(ctx, T.layer(l), lx, ly - 10, { align: 'right', size: 15, color: C.ink });
        Draw.text(ctx, T.layerNote(n), lx, ly + 11, { align: 'right', size: 13, weight: 500, color: C['ink-3'] });
        ctx.restore();
      }

      function render(i, k) {
        frame = { i, k };
        const { ctx, w, h } = cv;
        ctx.clearRect(0, 0, w, h);
        const t = i === 3 ? ease(k) : 0, fade = 1 - t;
        const c = i === 0 ? Math.max(1, Math.ceil(k * g.size)) : g.size;   // points inserted so far
        const L = i === 0 ? snaps[c - 1] : g.links;
        const maps = [];
        for (let l = 0; l <= top; l++) maps.push(mapOf(l, t));

        // How far the search has got: upper-layer events by weight, then layer 0's.
        const pu = i === 0 ? -1 : i === 1 ? k * upW : Infinity;
        const shown = up.filter(e => e.w0 < pu);
        const p0 = i < 2 ? 0 : i === 2 ? Math.round(k * ev0.length) : ev0.length;
        const seen = Array.from({ length: top + 1 }, () => new Set());
        if (i > 0) seen[top].add(g.entry);
        let active = top;
        for (const e of shown) {
          if (e.drop != null) { if (pu >= e.w0 + e.w) active = e.l - 1; }
          else { seen[e.l].add(e.id); active = e.l; }
        }
        for (let j = 0; j < p0; j++) seen[0].add(ev0[j].id);
        if (i >= 2) active = 0;

        for (let l = 0; l <= top; l++) {
          const Mp = maps[l];
          if (l) {
            // Between layer l-1 and l: each point's stacked copies, and the query's column.
            ctx.save();
            ctx.setLineDash([2, 4]); ctx.lineWidth = 1;
            ctx.strokeStyle = Draw.alpha(C['ink-3'], 0.6 * fade);
            ctx.beginPath();
            for (let u = 0; u < c; u++) if (g.level[u] >= l) {
              ctx.moveTo(maps[l - 1].x(g.pts[u]), maps[l - 1].y(g.pts[u])); ctx.lineTo(Mp.x(g.pts[u]), Mp.y(g.pts[u]));
            }
            ctx.stroke();
            if (i > 0) {
              ctx.strokeStyle = Draw.alpha(C.query, 0.5 * fade); ctx.lineWidth = 1.5;
              ctx.beginPath(); ctx.moveTo(maps[l - 1].x(q), maps[l - 1].y(q)); ctx.lineTo(Mp.x(q), Mp.y(q)); ctx.stroke();
            }
            ctx.restore();
          }
          if (fade > 0) plane(ctx, Mp, l, fade, c);

          ctx.save();
          ctx.lineWidth = 1;
          ctx.strokeStyle = Draw.alpha(C.ink, l ? 0.32 * fade : 0.1);
          ctx.beginPath();
          for (let u = 0; u < c; u++) {
            const Lu = L[u][l];
            if (!Lu) continue;
            for (const v of Lu) {
              if (v < u && L[v][l] && L[v][l].includes(u)) continue;   // a mutual link once
              ctx.moveTo(Mp.x(g.pts[u]), Mp.y(g.pts[u])); ctx.lineTo(Mp.x(g.pts[v]), Mp.y(g.pts[v]));
            }
          }
          ctx.stroke();
          ctx.restore();

          if (l) { for (const e of shown) if (e.l === l && e.id != null) Draw.segment(ctx, Mp, g.pts[e.from], g.pts[e.id], { color: Draw.alpha(C.amber, 0.45), width: 1 }); }
          else for (let j = 0; j < p0; j++) Draw.segment(ctx, Mp, g.pts[ev0[j].from], g.pts[ev0[j].id], { color: Draw.alpha(C.query, 0.22), width: 1 });

          for (let u = 0; u < c; u++) {
            if (g.level[u] < l) continue;
            if (!l) Draw.dot(ctx, Mp, g.pts[u], seen[0].has(u) ? { r: 3.2, fill: Draw.alpha(C.query, 0.55) } : { r: 2.3, fill: Draw.alpha(C.point, 0.8) });
            else Draw.dot(ctx, Mp, g.pts[u], { r: 2.6 + 0.9 * l, fill: seen[l].has(u) ? C.amber : C['ink-2'], ring: 1.2 });
          }
          // The point just inserted, on every layer it reaches.
          if (i === 0 && g.level[c - 1] >= l) Draw.ring(ctx, Mp, g.pts[c - 1], { r: 9, color: Draw.alpha(C.ink, 0.65), width: 1.5 });

          if (l) for (const e of shown) if (e.l === l && e.move) {
            Draw.walk(ctx, Mp, [g.pts[e.from], g.pts[e.id]], { color: C.amber, width: 2.75, nodes: false });
            Draw.dot(ctx, Mp, g.pts[e.id], { r: 4.2, fill: C.amber, ring: 1.5 });
          }
          if (!l && p0) Draw.walk(ctx, Mp, path0.filter((id, j) => reveal0[j] < p0).map(id => g.pts[id]));
          if (!l && (i === 3 || (i === 2 && k >= 1))) for (const id of run.ids) Draw.ring(ctx, Mp, g.pts[id], { r: 7.5, color: C.query });
        }

        // Drops from one layer to the next, the entry point and the query, on top of everything.
        for (const e of shown) if (e.drop != null) {
          const f = Math.min(1, (pu - e.w0) / e.w), a = [maps[e.l].x(g.pts[e.drop]), maps[e.l].y(g.pts[e.drop])];
          const b = [maps[e.l - 1].x(g.pts[e.drop]), maps[e.l - 1].y(g.pts[e.drop])];
          if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 2) continue;
          ctx.save();
          ctx.strokeStyle = C.amber; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]);
          ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(lerp(a[0], b[0], f), lerp(a[1], b[1], f)); ctx.stroke();
          ctx.restore();
          if (f >= 1) Draw.dot(ctx, maps[e.l - 1], g.pts[e.drop], { r: e.l - 1 ? 4.2 : 3.6, fill: e.l - 1 ? C.amber : C.query, ring: 1.5 });
        }
        if (i > 0) {
          const Mt = maps[top], e = g.pts[g.entry];
          Draw.text(ctx, T.start, Mt.x(e), Mt.y(e) - 16, { align: 'center', size: 14, color: C.ink });
          for (let l = 0; l <= top; l++) if (l !== active && fade > 0) Draw.ring(ctx, maps[l], q, { r: 5, color: Draw.alpha(C.query, 0.6 * fade), width: 1.5 });
          const Mq = maps[active];
          Draw.query(ctx, Mq, q);
